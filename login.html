<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — AXORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0c0f; --steel:#1b1f26; --chrome:#c9d0d6; --chrome-dim:#7d848d;
    --red:#d62839; --gold:#e3b23c; --white:#f4f6f7; --line: rgba(201,208,214,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--black); color:var(--white); font-family:'Manrope', sans-serif;
    min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0;
    background-image:radial-gradient(circle at 50% -10%, rgba(214,40,57,0.10), transparent 55%);
    pointer-events:none;
  }
  a{color:inherit; text-decoration:none;}
  header{padding:20px 24px; border-bottom:1px solid var(--line); position:relative; z-index:1;}
  .logo{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:22px; letter-spacing:0.12em;
    background:linear-gradient(120deg, #dfe4e8, #8b929a 45%, #f4f6f7 55%, #6f757d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo span{color:var(--red); -webkit-text-fill-color:var(--red);}
  .car-stage{
    position:relative; z-index:1; padding:28px 20px 8px; text-align:center;
    background:linear-gradient(180deg, rgba(214,40,57,0.08), transparent 70%);
  }
  .car-stage svg{width:100%; max-width:360px; height:auto; margin:0 auto;}
  .car-caption{
    font-family:'Rajdhani',sans-serif; font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--chrome-dim); margin-top:6px;
  }
  main{flex:1; display:flex; align-items:flex-start; justify-content:center; padding:20px 20px 40px; position:relative; z-index:1;}
  .card{
    width:100%; max-width:420px; background:var(--steel); border:1px solid var(--line);
    border-top:2px solid var(--red); border-radius:8px; padding:30px 24px;
  }
  .eyebrow{
    font-family:'Rajdhani', sans-serif; font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--gold); margin-bottom:6px;
  }
  h1{font-family:'Rajdhani', sans-serif; font-weight:700; text-transform:uppercase; font-size:26px; margin-bottom:6px;}
  .sub{color:var(--chrome-dim); font-size:14px; margin-bottom:24px; line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-family:'Rajdhani',sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chrome-dim); margin-bottom:6px;}
  .field input{
    width:100%; background:var(--black); border:1px solid var(--line); color:var(--white);
    padding:12px 13px; font-family:'Space Mono',monospace; font-size:14px; border-radius:4px; outline:none;
  }
  .field input:focus{border-color:var(--red);}
  .field select{
    width:100%; background:var(--black); border:1px solid var(--line); color:var(--white);
    padding:12px 13px; font-family:'Space Mono',monospace; font-size:14px; border-radius:4px; outline:none;
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237d848d' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 13px center; background-size:16px;
  }
  .field select:focus{border-color:var(--red);}
  .submit{
    width:100%; margin-top:8px; font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:0.06em;
    text-transform:uppercase; font-size:15px; padding:14px; border-radius:4px;
    background:var(--red); color:#fff; border:1px solid var(--red); cursor:pointer;
  }
  .submit:disabled{opacity:0.6; cursor:wait;}
  .switch{text-align:center; margin-top:18px; font-size:13px; color:var(--chrome-dim);}
  .switch a{color:var(--gold);}
  .msg{
    font-family:'Rajdhani',sans-serif; font-size:13px; padding:11px 13px; border-radius:4px;
    margin-bottom:16px; display:none;
  }
  .msg.show{display:block;}
  .msg.err{background:rgba(214,40,57,0.14); color:#ff8a94; border:1px solid rgba(214,40,57,0.35);}
  .msg.ok{background:rgba(227,178,60,0.12); color:var(--gold); border:1px solid rgba(227,178,60,0.35);}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">AX<span>O</span>RA</a>
</header>

<div class="car-stage">
  <svg viewBox="0 0 400 160" fill="none">
    <defs>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e8edf1"/>
        <stop offset="45%" stop-color="#aab1b8"/>
        <stop offset="55%" stop-color="#7d848d"/>
        <stop offset="100%" stop-color="#3a4048"/>
      </linearGradient>
      <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3a4048"/>
        <stop offset="100%" stop-color="#181b20"/>
      </linearGradient>
    </defs>
    <ellipse cx="200" cy="140" rx="170" ry="10" fill="#000" opacity="0.5"/>
    <path d="M35 118 C40 88 70 82 100 78 L130 50 C145 40 165 36 190 36 L250 36 C270 36 285 42 298 54 L320 78 C345 82 365 92 372 112 L372 122 C372 128 366 132 360 132 L326 132 C324 118 312 108 298 108 C284 108 272 118 270 132 L142 132 C140 118 128 108 114 108 C100 108 88 118 86 132 L48 132 C40 132 35 126 35 118 Z" fill="url(#bodyGrad)" stroke="#0a0c0f" stroke-width="1.5"/>
    <path d="M136 76 L152 52 C162 44 175 40 192 40 L246 40 C262 40 273 45 283 55 L300 76 Z" fill="url(#glassGrad)"/>
    <line x1="212" y1="40" x2="210" y2="76" stroke="#0a0c0f" stroke-width="2"/>
    <circle cx="114" cy="132" r="26" fill="#121417" stroke="#3a4048" stroke-width="2"/>
    <circle cx="114" cy="132" r="11" fill="#7d848d"/>
    <circle cx="298" cy="132" r="26" fill="#121417" stroke="#3a4048" stroke-width="2"/>
    <circle cx="298" cy="132" r="11" fill="#7d848d"/>
    <rect x="40" y="96" width="34" height="7" rx="3" fill="#d62839"/>
    <rect x="330" y="96" width="30" height="6" rx="3" fill="#e3b23c"/>
  </svg>
  <div class="car-caption">AXORA · Édition performance</div>
</div>

<main>
  <div class="card">
    <div class="eyebrow">Retour piste</div>
    <h1>Connexion</h1>
    <p class="sub">Accédez à votre tableau de bord AXORA.</p>

    <div class="msg" id="msg"></div>

    <form id="login-form" onsubmit="return handleLogin(event)">
      <div class="field">
        <label>Pays</label>
        <select id="li-country" required>
          <option value="" disabled selected>Sélectionnez votre pays</option>
          <option value="SN">🇸🇳 Sénégal</option>
          <option value="CM">🇨🇲 Cameroun</option>
          <option value="TG">🇹🇬 Togo</option>
          <option value="BJ">🇧🇯 Bénin</option>
          <option value="CI">🇨🇮 Côte d'Ivoire</option>
          <option value="NE">🇳🇪 Niger</option>
        </select>
      </div>
      <div class="field">
        <label>Adresse email</label>
        <input type="email" id="li-email" placeholder="vous@exemple.com" required>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="li-password" required>
      </div>
      <button type="submit" class="submit" id="submit-btn">Se connecter</button>
    </form>

    <div class="switch">Pas encore de compte ? <a href="signup.html">S'inscrire</a></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://tjwauutdpdahzxphhrxa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqd2F1dXRkcGRhaHp4cGhocnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODg3MTQsImV4cCI6MjEwMDQ2NDcxNH0.KTZte9pS5JUu1gZJ4i7KXIDc4hHFjJhDlZcoy6begnA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showMsg(text, isError){
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg show ' + (isError ? 'err' : 'ok');
  }

  async function handleLogin(e){
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const email = document.getElementById('li-email').value.trim();
    const password = document.getElementById('li-password').value;

    btn.disabled = true; btn.textContent = 'Connexion…';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    btn.disabled = false; btn.textContent = 'Se connecter';

    if(error){
      showMsg('Email ou mot de passe incorrect.', true);
      return false;
    }

    showMsg('Connexion réussie ! Redirection vers votre tableau de bord…', false);
    // À adapter dès que le tableau de bord existe :
    // window.location.href = 'dashboard.html';
    return false;
  }
</script>
</body>
</html>
