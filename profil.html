<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — ROMANDEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0c0f; --steel:#1b1f26; --chrome:#c9d0d6; --chrome-dim:#7d848d;
    --red:#d62839; --gold:#e3b23c; --white:#f4f6f7; --line: rgba(201,208,214,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--black); color:var(--white); font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:78px;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:520px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:40; background:rgba(10,12,15,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  header .wrap{display:flex; align-items:center; gap:12px; height:60px;}
  .back{font-size:20px; color:var(--chrome-dim);}
  .logo{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:20px; letter-spacing:0.12em;
    background:linear-gradient(120deg, #dfe4e8, #8b929a 45%, #f4f6f7 55%, #6f757d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo span{color:var(--red); -webkit-text-fill-color:var(--red);}

  main{padding:20px 0 30px;}

  .profile-hero{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:18px 0 22px;
  }
  .avatar{
    width:72px; height:72px; border-radius:50%; margin-bottom:12px;
    background:linear-gradient(160deg, var(--steel), #14171c); border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:26px; color:var(--gold);
  }
  .profile-hero .email{font-family:'Rajdhani',sans-serif; font-weight:600; font-size:17px;}
  .profile-hero .vip{
    margin-top:8px; font-family:'Rajdhani',sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
    background:rgba(227,178,60,0.12); color:var(--gold); border:1px solid rgba(227,178,60,0.35);
    padding:5px 12px; border-radius:20px;
  }

  .section{margin-top:18px;}
  .section-title{font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; font-size:14px; letter-spacing:0.05em; color:var(--chrome); margin-bottom:10px;}

  .info-card{background:var(--steel); border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .info-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 15px; border-bottom:1px solid var(--line);
  }
  .info-row:last-child{border-bottom:none;}
  .info-row .k{font-family:'Rajdhani',sans-serif; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--chrome-dim);}
  .info-row .v{font-family:'Space Mono',monospace; font-size:13px; color:var(--white);}

  .action-list{display:flex; flex-direction:column; gap:10px;}
  .action-btn{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:14px 16px;
    font-family:'Rajdhani',sans-serif; font-weight:600; text-transform:uppercase; font-size:14px; letter-spacing:0.03em;
    cursor:pointer;
  }
  .action-btn .icon{display:flex; align-items:center; gap:12px; color:var(--white);}
  .action-btn .icon svg{width:18px; height:18px; color:var(--chrome-dim);}
  .action-btn .chev{color:var(--chrome-dim);}
  .action-btn.support{border-color:rgba(227,178,60,0.35);}
  .action-btn.support .icon svg{color:var(--gold);}
  .action-btn.logout{color:var(--red);}
  .action-btn.logout .icon svg{color:var(--red);}

  .loading-screen{
    position:fixed; inset:0; background:var(--black); display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; color:var(--chrome-dim); letter-spacing:0.1em; text-transform:uppercase; font-size:13px; z-index:100;
  }
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    display:flex; background:rgba(10,12,15,0.95); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:9px 4px 8px; color:var(--chrome-dim);
    font-family:'Rajdhani',sans-serif; font-size:10px; letter-spacing:0.06em; text-transform:uppercase;
  }
  .nav-item svg{width:20px; height:20px;}
  .nav-item.active{color:var(--red);}
</style>
</head>
<body>

<div class="loading-screen" id="loading-screen">Chargement…</div>

<header>
  <div class="wrap">
    <a href="dashboard.html" class="back">←</a>
    <div class="logo">R<span>O</span>MANDEX</div>
  </div>
</header>

<main class="wrap">

  <div class="profile-hero">
    <div class="avatar" id="avatar-initial">—</div>
    <div class="email" id="profile-email">—</div>
    <div class="vip" id="profile-vip">VIP 0</div>
  </div>

  <div class="section">
    <div class="section-title">Informations du compte</div>
    <div class="info-card">
      <div class="info-row"><div class="k">Téléphone</div><div class="v" id="info-phone">—</div></div>
      <div class="info-row"><div class="k">Pays</div><div class="v" id="info-country">—</div></div>
      <div class="info-row"><div class="k">Solde</div><div class="v" id="info-balance">—</div></div>
      <div class="info-row"><div class="k">Membre depuis</div><div class="v" id="info-since">—</div></div>
      <div class="info-row"><div class="k">Code parrainage</div><div class="v" id="info-refcode">—</div></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Assistance</div>
    <div class="action-list">
      <a href="support.html" class="action-btn support">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18v-6"/><circle cx="12" cy="8" r="0.5" fill="currentColor"/><circle cx="12" cy="12" r="9"/></svg>
          Contacter le support
        </span>
        <span class="chev">›</span>
      </a>
    </div>
  </div>

  <div class="section">
    <div class="action-list">
      <div class="action-btn logout" onclick="handleLogout()">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Déconnexion
        </span>
      </div>
    </div>
  </div>

</main>

<nav class="bottom-nav">
  <a href="invest.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
    <span>Investir</span>
  </a>
  <a href="vitesse.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15 16 10"/><circle cx="12" cy="15" r="1"/></svg>
    <span>Vitesse</span>
  </a>
  <a href="profil.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span>Profil</span>
  </a>
  <a href="affilie.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M2 21c0-3.5 2.5-6 5-6s5 2.5 5 6"/><path d="M12 21c0-3.5 2.5-6 5-6s5 2.5 5 6"/></svg>
    <span>Affilié</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://tjwauutdpdahzxphhrxa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqd2F1dXRkcGRhaHp4cGhocnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODg3MTQsImV4cCI6MjEwMDQ2NDcxNH0.KTZte9pS5JUu1gZJ4i7KXIDc4hHFjJhDlZcoy6begnA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const COUNTRY_NAMES = { SN:'🇸🇳 Sénégal', CM:'🇨🇲 Cameroun', TG:'🇹🇬 Togo', BJ:'🇧🇯 Bénin', CI:'🇨🇮 Côte d\'Ivoire', NE:'🇳🇪 Niger', BF:'🇧🇫 Burkina Faso', ML:'🇲🇱 Mali' };

  function fmt(n){ return Math.round(n).toLocaleString('fr-FR'); }

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if(!session || !session.user){ window.location.href = 'login.html'; return; }

    const { data: prof, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if(error || !prof){ window.location.href = 'login.html'; return; }

    document.getElementById('avatar-initial').textContent = prof.email.charAt(0).toUpperCase();
    document.getElementById('profile-email').textContent = prof.email;
    document.getElementById('profile-vip').textContent = 'VIP ' + prof.vip_level;
    document.getElementById('info-phone').textContent = prof.phone || '—';
    document.getElementById('info-country').textContent = COUNTRY_NAMES[prof.country] || (prof.country || '—');
    document.getElementById('info-balance').textContent = fmt(prof.balance) + ' FCFA';
    document.getElementById('info-since').textContent = new Date(prof.created_at).toLocaleDateString('fr-FR');
    document.getElementById('info-refcode').textContent = prof.referral_code;

    document.getElementById('loading-screen').style.display = 'none';
  }

  async function handleLogout(){
    await sb.auth.signOut();
    window.location.href = 'login.html';
  }

  init();
</script>
</body>
</html>
