<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — ROMANDEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0c0f; --steel:#1b1f26; --chrome:#c9d0d6; --chrome-dim:#7d848d;
    --red:#d62839; --gold:#e3b23c; --white:#f4f6f7; --line: rgba(201,208,214,0.12);
    --green:#3ecf7e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--black); color:var(--white); font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:30px;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:760px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:40; background:rgba(10,12,15,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  header .wrap{display:flex; align-items:center; justify-content:space-between; height:60px;}
  .logo{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:20px; letter-spacing:0.12em;
    background:linear-gradient(120deg, #dfe4e8, #8b929a 45%, #f4f6f7 55%, #6f757d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo span{color:var(--red); -webkit-text-fill-color:var(--red);}
  .admin-tag{font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); border:1px solid rgba(227,178,60,0.35); padding:4px 10px; border-radius:12px;}

  main{padding:20px 0 30px;}
  .page-title{font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; font-size:22px; margin-bottom:16px;}

  .stats-row{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:24px;}
  .stat-box{background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:14px;}
  .stat-box .v{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; color:var(--gold);}
  .stat-box .k{font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--chrome-dim); margin-top:2px;}

  .section{margin-top:26px;}
  .section-title{font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; font-size:15px; letter-spacing:0.05em; color:var(--chrome); margin-bottom:12px;}

  .wd-item{
    background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:10px;
  }
  .wd-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .wd-top .who{font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px;}
  .wd-top .when{font-size:11px; color:var(--chrome-dim); margin-top:2px;}
  .wd-amt{font-family:'Space Mono',monospace; font-size:16px; color:var(--gold); text-align:right;}
  .wd-fee{font-size:11px; color:var(--chrome-dim); text-align:right; margin-top:2px;}
  .wd-actions{display:flex; gap:8px; margin-top:12px;}
  .wd-btn{
    flex:1; font-family:'Rajdhani',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;
    font-size:12px; padding:9px; border-radius:4px; cursor:pointer; border:none;
  }
  .wd-btn.approve{background:var(--green); color:#06210f;}
  .wd-btn.reject{background:var(--red); color:#fff;}
  .wd-btn:disabled{opacity:0.5; cursor:default;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--chrome-dim);
    text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);
  }
  td{padding:10px; border-bottom:1px solid var(--line); font-family:'Space Mono',monospace; font-size:12px;}
  .table-wrap{background:var(--steel); border:1px solid var(--line); border-radius:8px; overflow-x:auto;}
  .vip-tag{
    font-family:'Rajdhani',sans-serif; font-size:11px; text-transform:uppercase;
    background:rgba(227,178,60,0.12); color:var(--gold); border:1px solid rgba(227,178,60,0.3); padding:2px 8px; border-radius:10px;
  }

  .empty{color:var(--chrome-dim); font-size:13px; text-align:center; padding:20px 0;}
  .msg{font-family:'Rajdhani',sans-serif; font-size:13px; padding:10px 12px; border-radius:4px; margin-bottom:14px; display:none;}
  .msg.show{display:block;}
  .msg.err{background:rgba(214,40,57,0.14); color:#ff8a94; border:1px solid rgba(214,40,57,0.35);}
  .msg.ok{background:rgba(62,207,126,0.12); color:var(--green); border:1px solid rgba(62,207,126,0.35);}

  .loading-screen{
    position:fixed; inset:0; background:var(--black); display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; color:var(--chrome-dim); letter-spacing:0.1em; text-transform:uppercase; font-size:13px; z-index:100;
  }
</style>
</head>
<body>

<div class="loading-screen" id="loading-screen">Vérification des accès…</div>

<header>
  <div class="wrap">
    <div class="logo">R<span>O</span>MANDEX</div>
    <div class="admin-tag">Admin</div>
  </div>
</header>

<main class="wrap">
  <div class="page-title">Tableau d'administration</div>

  <div class="msg" id="admin-msg"></div>

  <div class="stats-row">
    <div class="stat-box"><div class="v" id="stat-users">—</div><div class="k">Utilisateurs</div></div>
    <div class="stat-box"><div class="v" id="stat-balance">—</div><div class="k">Solde total en circulation</div></div>
    <div class="stat-box"><div class="v" id="stat-pending-count">—</div><div class="k">Retraits en attente</div></div>
    <div class="stat-box"><div class="v" id="stat-pending-amt">—</div><div class="k">Montant en attente</div></div>
  </div>

  <div class="section">
    <div class="section-title">Retraits en attente</div>
    <div id="withdrawals-list"><div class="empty">Chargement…</div></div>
  </div>

  <div class="section">
    <div class="section-title">Utilisateurs récents</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Email</th><th>Pays</th><th>VIP</th><th>Solde</th><th>Inscrit</th></tr></thead>
        <tbody id="users-table"><tr><td colspan="5" class="empty">Chargement…</td></tr></tbody>
      </table>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://tjwauutdpdahzxphhrxa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqd2F1dXRkcGRhaHp4cGhocnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODg3MTQsImV4cCI6MjEwMDQ2NDcxNH0.KTZte9pS5JUu1gZJ4i7KXIDc4hHFjJhDlZcoy6begnA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function fmt(n){ return Math.round(n).toLocaleString('fr-FR'); }
  function showMsg(text, isError){
    const el = document.getElementById('admin-msg');
    el.textContent = text;
    el.className = 'msg show ' + (isError ? 'err' : 'ok');
  }

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if(!session || !session.user){ window.location.href = 'login.html'; return; }

    const { data: prof, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if(error || !prof){ window.location.href = 'login.html'; return; }

    if(!prof.is_admin){
      window.location.href = 'dashboard.html';
      return;
    }

    await loadStats();
    await loadWithdrawals();
    await loadUsers();

    document.getElementById('loading-screen').style.display = 'none';
  }

  async function loadStats(){
    const { data: profiles } = await sb.from('profiles').select('balance');
    const totalUsers = profiles ? profiles.length : 0;
    const totalBalance = (profiles || []).reduce((s,p) => s + Number(p.balance), 0);
    document.getElementById('stat-users').textContent = totalUsers;
    document.getElementById('stat-balance').textContent = fmt(totalBalance) + 'F';

    const { data: pending } = await sb.from('transactions').select('amount').eq('type','withdrawal').eq('status','pending');
    const pendingCount = pending ? pending.length : 0;
    const pendingAmt = (pending || []).reduce((s,t) => s + Number(t.amount), 0);
    document.getElementById('stat-pending-count').textContent = pendingCount;
    document.getElementById('stat-pending-amt').textContent = fmt(pendingAmt) + 'F';
  }

  async function loadWithdrawals(){
    const el = document.getElementById('withdrawals-list');
    const { data, error } = await sb.from('transactions')
      .select('id, amount, fee, created_at, user_id, profiles!transactions_user_id_fkey(email, phone)')
      .eq('type','withdrawal').eq('status','pending')
      .order('created_at', { ascending:true });

    if(error){
      el.innerHTML = `<div class="empty">Erreur de chargement : ${error.message}</div>`;
      return;
    }
    if(!data || data.length === 0){
      el.innerHTML = '<div class="empty">Aucun retrait en attente.</div>';
      return;
    }

    el.innerHTML = data.map(t => `
      <div class="wd-item" id="wd-${t.id}">
        <div class="wd-top">
          <div>
            <div class="who">${t.profiles ? t.profiles.email : t.user_id}</div>
            <div class="when">${t.profiles ? t.profiles.phone : ''} · ${new Date(t.created_at).toLocaleString('fr-FR')}</div>
          </div>
          <div>
            <div class="wd-amt">${fmt(t.amount)}F</div>
            <div class="wd-fee">frais ${fmt(t.fee)}F</div>
          </div>
        </div>
        <div class="wd-actions">
          <button class="wd-btn approve" onclick="processWithdrawal('${t.id}', 'completed', 0)">Valider</button>
          <button class="wd-btn reject" onclick="processWithdrawal('${t.id}', 'failed', ${t.amount})">Rejeter (rembourser)</button>
        </div>
      </div>
    `).join('');
  }

  async function processWithdrawal(txId, newStatus, refundAmount){
    const item = document.getElementById('wd-' + txId);
    item.querySelectorAll('.wd-btn').forEach(b => b.disabled = true);

    const { data: tx, error: txFetchErr } = await sb.from('transactions').select('user_id, amount').eq('id', txId).single();
    if(txFetchErr){ showMsg("Erreur : " + txFetchErr.message, true); return; }

    const { error: updErr } = await sb.from('transactions').update({ status: newStatus }).eq('id', txId);
    if(updErr){ showMsg("Erreur : " + updErr.message, true); return; }

    if(refundAmount > 0){
      const { data: userProf } = await sb.from('profiles').select('balance').eq('id', tx.user_id).single();
      if(userProf){
        await sb.from('profiles').update({ balance: Number(userProf.balance) + refundAmount }).eq('id', tx.user_id);
      }
    }

    showMsg(newStatus === 'completed' ? 'Retrait validé.' : 'Retrait rejeté, montant remboursé au solde.', false);
    item.remove();
    await loadStats();
  }

  async function loadUsers(){
    const el = document.getElementById('users-table');
    const { data, error } = await sb.from('profiles')
      .select('email, country, vip_level, balance, created_at')
      .order('created_at', { ascending:false })
      .limit(30);

    if(error){
      el.innerHTML = `<tr><td colspan="5" class="empty">Erreur : ${error.message}</td></tr>`;
      return;
    }
    if(!data || data.length === 0){
      el.innerHTML = '<tr><td colspan="5" class="empty">Aucun utilisateur.</td></tr>';
      return;
    }

    el.innerHTML = data.map(u => `
      <tr>
        <td>${u.email}</td>
        <td>${u.country || '—'}</td>
        <td><span class="vip-tag">VIP ${u.vip_level}</span></td>
        <td>${fmt(u.balance)}F</td>
        <td>${new Date(u.created_at).toLocaleDateString('fr-FR')}</td>
      </tr>
    `).join('');
  }

  init();
</script>
</body>
</html>
