<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — ROMANDEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0c0f; --steel:#1b1f26; --chrome:#c9d0d6; --chrome-dim:#7d848d;
    --red:#d62839; --gold:#e3b23c; --white:#f4f6f7; --line: rgba(201,208,214,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--black); color:var(--white); font-family:'Manrope', sans-serif;
    min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0;
    background-image:radial-gradient(circle at 50% -10%, rgba(214,40,57,0.10), transparent 55%);
    pointer-events:none;
  }
  a{color:inherit; text-decoration:none;}
  header{padding:20px 24px; border-bottom:1px solid var(--line); position:relative; z-index:1;}
  .logo{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:22px; letter-spacing:0.12em;
    background:linear-gradient(120deg, #dfe4e8, #8b929a 45%, #f4f6f7 55%, #6f757d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo span{color:var(--red); -webkit-text-fill-color:var(--red);}
  .car-stage{
    position:relative; z-index:1; padding:24px 0 6px; text-align:center;
    background:linear-gradient(180deg, rgba(214,40,57,0.08), transparent 70%);
    overflow:hidden;
  }
  .car-photo{
    width:100%; max-width:480px; margin:0 auto;
    -webkit-mask-image: radial-gradient(ellipse 68% 72% at 50% 48%, black 50%, transparent 100%);
    mask-image: radial-gradient(ellipse 68% 72% at 50% 48%, black 50%, transparent 100%);
  }
  .car-photo img{width:100%; display:block; filter:brightness(0.94) contrast(1.05);}
  .car-caption{
    font-family:'Rajdhani',sans-serif; font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--chrome-dim); margin-top:2px;
  }
  main{flex:1; display:flex; align-items:flex-start; justify-content:center; padding:20px 20px 40px; position:relative; z-index:1;}
  .card{
    width:100%; max-width:420px; background:var(--steel); border:1px solid var(--line);
    border-top:2px solid var(--red); border-radius:8px; padding:30px 24px;
  }
  .eyebrow{
    font-family:'Rajdhani', sans-serif; font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--gold); margin-bottom:6px;
  }
  h1{font-family:'Rajdhani', sans-serif; font-weight:700; text-transform:uppercase; font-size:26px; margin-bottom:6px;}
  .sub{color:var(--chrome-dim); font-size:14px; margin-bottom:24px; line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-family:'Rajdhani',sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chrome-dim); margin-bottom:6px;}
  .field input{
    width:100%; background:var(--black); border:1px solid var(--line); color:var(--white);
    padding:12px 13px; font-family:'Space Mono',monospace; font-size:14px; border-radius:4px; outline:none;
  }
  .field input:focus{border-color:var(--red);}
  .field select{
    width:100%; background:var(--black); border:1px solid var(--line); color:var(--white);
    padding:12px 13px; font-family:'Space Mono',monospace; font-size:14px; border-radius:4px; outline:none;
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237d848d' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 13px center; background-size:16px;
  }
  .field select:focus{border-color:var(--red);}
  .field .hint{font-size:11px; color:var(--chrome-dim); margin-top:5px;}
  .submit{
    width:100%; margin-top:8px; font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:0.06em;
    text-transform:uppercase; font-size:15px; padding:14px; border-radius:4px;
    background:var(--red); color:#fff; border:1px solid var(--red); cursor:pointer;
  }
  .submit:disabled{opacity:0.6; cursor:wait;}
  .switch{text-align:center; margin-top:18px; font-size:13px; color:var(--chrome-dim);}
  .switch a{color:var(--gold);}
  .msg{
    font-family:'Rajdhani',sans-serif; font-size:13px; padding:11px 13px; border-radius:4px;
    margin-bottom:16px; display:none;
  }
  .msg.show{display:block;}
  .msg.err{background:rgba(214,40,57,0.14); color:#ff8a94; border:1px solid rgba(214,40,57,0.35);}
  .msg.ok{background:rgba(227,178,60,0.12); color:var(--gold); border:1px solid rgba(227,178,60,0.35);}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">R<span>O</span>MANDEX</a>
</header>

<div class="car-stage">
  <div class="car-photo">
    <img src="https://i.ibb.co/YKC4Nc3/IMG-20260724-164451-314.jpg" alt="Véhicule ROMANDEX">
  </div>
  <div class="car-caption">ROMANDEX · Édition performance</div>
</div>

<main>
  <div class="card">
    <div class="eyebrow">Nouveau pilote</div>
    <h1>Créer un compte</h1>
    <p class="sub">Bonus de 500F crédité dès l'inscription.</p>

    <div class="msg" id="msg"></div>

    <form id="signup-form" onsubmit="return handleSignup(event)">
      <div class="field">
        <label>Adresse email</label>
        <input type="email" id="su-email" placeholder="vous@exemple.com" required>
      </div>
      <div class="field">
        <label>Numéro de téléphone</label>
        <input type="tel" id="su-phone" placeholder="77 123 45 67" required>
        <div class="hint">Utilisé pour les dépôts et retraits Mobile Money.</div>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="su-password" placeholder="6 caractères minimum" minlength="6" required>
      </div>
      <div class="field">
        <label>Pays</label>
        <select id="su-country" required>
          <option value="" disabled selected>Sélectionnez votre pays</option>
          <option value="SN">🇸🇳 Sénégal</option>
          <option value="CM">🇨🇲 Cameroun</option>
          <option value="TG">🇹🇬 Togo</option>
          <option value="BJ">🇧🇯 Bénin</option>
          <option value="CI">🇨🇮 Côte d'Ivoire</option>
          <option value="NE">🇳🇪 Niger</option>
          <option value="BF">🇧🇫 Burkina Faso</option>
        </select>
      </div>
      <div class="field">
        <label>Code de parrainage (optionnel)</label>
        <input type="text" id="su-ref" placeholder="RX7F3K2Q">
      </div>
      <button type="submit" class="submit" id="submit-btn">Créer mon compte</button>
    </form>

    <div class="switch">Déjà un compte ? <a href="login.html">Se connecter</a></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://tjwauutdpdahzxphhrxa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqd2F1dXRkcGRhaHp4cGhocnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODg3MTQsImV4cCI6MjEwMDQ2NDcxNH0.KTZte9pS5JUu1gZJ4i7KXIDc4hHFjJhDlZcoy6begnA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function genReferralCode(){
    return 'RX' + Math.random().toString(36).slice(2,8).toUpperCase();
  }

  // Récupère le code de parrainage depuis l'URL (ex: signup.html?ref=RX7F3K2Q) et le pré-remplit.
  (function prefillReferralFromUrl(){
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref');
    if(ref){
      const field = document.getElementById('su-ref');
      field.value = ref.trim().toUpperCase();
    }
  })();
  function showMsg(text, isError){
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg show ' + (isError ? 'err' : 'ok');
  }

  async function handleSignup(e){
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const email = document.getElementById('su-email').value.trim();
    const phone = document.getElementById('su-phone').value.trim();
    const password = document.getElementById('su-password').value;
    const country = document.getElementById('su-country').value;
    const refCode = document.getElementById('su-ref').value.trim().toUpperCase();

    btn.disabled = true; btn.textContent = 'Création en cours…';

    const { data, error } = await sb.auth.signUp({ email, password });

    if(error){
      showMsg(error.message.includes('already') || error.message.includes('registered')
        ? 'Un compte existe déjà avec cet email.' : error.message, true);
      btn.disabled = false; btn.textContent = 'Créer mon compte';
      return false;
    }

    const userId = data.user ? data.user.id : data.session.user.id;
    const myCode = genReferralCode();

    const { error: profErr } = await sb.from('profiles').insert({
      id: userId,
      email: email,
      phone: phone,
      country: country,
      referral_code: myCode,
      referred_by: refCode || null,
      balance: 500,
      vip_level: 0
    });

    btn.disabled = false; btn.textContent = 'Créer mon compte';

    if(profErr){
      showMsg("Compte créé mais erreur profil : " + profErr.message, true);
      return false;
    }

    showMsg(`Compte créé ! Bonus de 500F crédité. Redirection…`, false);
    document.getElementById('signup-form').reset();
    try { localStorage.setItem('romandex_welcome_pending', '1'); } catch(e){}
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
    return false;
  }
</script>
</body>
</html>
