name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Check release keystore
        run: |
          ls -lh ecranplus-release.jks
          keytool -list -v \
            -keystore ecranplus-release.jks \
            -alias ecranplus \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            | grep "SHA256"

      - name: Build signed Release APK
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/ecranplus-release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="ecranplus" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ecranplus-release
          path: app/build/outputs/apk/release/app-release.apk
