name: Build Android App Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Check project
        run: |
          echo "=== Application ID ==="
          grep -R "applicationId" -n app --include="*.gradle" --include="*.gradle.kts" || true

          echo "=== Namespace ==="
          grep -R "namespace" -n app --include="*.gradle" --include="*.gradle.kts" || true

      - name: Clean project
        run: gradle clean

      - name: Build Release AAB
        run: gradle bundleRelease --stacktrace

      - name: Show generated files
        if: success()
        run: |
          echo "=== Generated AAB ==="
          find app/build/outputs -type f -name "*.aab" -print

      - name: Upload Release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error