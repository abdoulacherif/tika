name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Check project
        run: |
          echo "=== Application ID ==="
          grep -R "applicationId" -n . --include="*.gradle" --include="*.gradle.kts" || true

          echo "=== Namespace ==="
          grep -R "namespace" -n app --include="*.gradle" --include="*.gradle.kts" || true

          echo "=== Gradle files ==="
          find . -name "build.gradle" -o -name "build.gradle.kts"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Get SHA-256 signing fingerprint
        if: success()
        run: |
          mkdir -p ~/.android

          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Debug keystore not found. Creating one..."

            keytool -genkeypair \
              -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "=== SHA-256 ==="

          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E "SHA256|SHA-256" || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk