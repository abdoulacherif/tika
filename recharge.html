<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recharge — ROMANDEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0c0f; --steel:#1b1f26; --chrome:#c9d0d6; --chrome-dim:#7d848d;
    --red:#d62839; --gold:#e3b23c; --white:#f4f6f7; --line: rgba(201,208,214,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--black); color:var(--white); font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:78px;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:520px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:40; background:rgba(10,12,15,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  header .wrap{display:flex; align-items:center; gap:12px; height:60px;}
  .back{font-size:20px; color:var(--chrome-dim);}
  .logo{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:20px; letter-spacing:0.12em;
    background:linear-gradient(120deg, #dfe4e8, #8b929a 45%, #f4f6f7 55%, #6f757d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo span{color:var(--red); -webkit-text-fill-color:var(--red);}

  main{padding:20px 0 30px;}
  .page-title{font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; font-size:22px; margin-bottom:4px;}
  .page-sub{color:var(--chrome-dim); font-size:13px; margin-bottom:18px;}

  .balance-note{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:16px;
  }
  .balance-note .lbl{font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chrome-dim);}
  .balance-note .amt{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; margin-top:2px;}

  .provider-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .provider-card{
    background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:14px 12px; text-align:center;
    cursor:pointer; transition:border-color .15s ease;
  }
  .provider-card.active{border-color:var(--gold);}
  .provider-card .name{font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; font-size:14px;}
  .provider-card .tag{font-size:10px; color:var(--chrome-dim); margin-top:3px; text-transform:uppercase; letter-spacing:0.05em;}

  .form-card{background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chrome-dim); margin-bottom:6px;}
  .field input, .field select{
    width:100%; background:var(--black); border:1px solid var(--line); color:var(--white);
    padding:11px 12px; font-family:'Space Mono',monospace; font-size:14px; border-radius:4px; outline:none;
  }
  .field select{
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237d848d' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 13px center; background-size:16px;
  }
  .field input:focus, .field select:focus{border-color:var(--red);}
  .quick-amounts{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
  .quick-amt{
    font-family:'Space Mono',monospace; font-size:12px; text-align:center; padding:9px 4px;
    background:var(--black); border:1px solid var(--line); border-radius:4px; color:var(--chrome); cursor:pointer;
  }
  .quick-amt.active{border-color:var(--gold); color:var(--gold);}
  .fee-note{font-size:12px; color:var(--chrome-dim); margin:-4px 0 12px; line-height:1.5;}
  .submit-btn{
    width:100%; font-family:'Rajdhani',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.05em;
    font-size:14px; background:var(--red); color:#fff; border:none; padding:13px; border-radius:4px; cursor:pointer;
  }
  .submit-btn:disabled{opacity:0.6; cursor:wait;}

  .msg{font-family:'Rajdhani',sans-serif; font-size:13px; padding:10px 12px; border-radius:4px; margin-bottom:14px; display:none; line-height:1.5;}
  .msg.show{display:block;}
  .msg.err{background:rgba(214,40,57,0.14); color:#ff8a94; border:1px solid rgba(214,40,57,0.35);}
  .msg.ok{background:rgba(227,178,60,0.12); color:var(--gold); border:1px solid rgba(227,178,60,0.35);}

  .loading-screen{
    position:fixed; inset:0; background:var(--black); display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; color:var(--chrome-dim); letter-spacing:0.1em; text-transform:uppercase; font-size:13px; z-index:100;
  }
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    display:flex; background:rgba(10,12,15,0.95); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:9px 4px 8px; color:var(--chrome-dim);
    font-family:'Rajdhani',sans-serif; font-size:10px; letter-spacing:0.06em; text-transform:uppercase;
  }
  .nav-item svg{width:20px; height:20px;}
  .nav-item.active{color:var(--red);}
</style>
</head>
<body>

<div class="loading-screen" id="loading-screen">Chargement…</div>

<header>
  <div class="wrap">
    <a href="dashboard.html" class="back">←</a>
    <div class="logo">R<span>O</span>MANDEX</div>
  </div>
</header>

<main class="wrap">
  <div class="page-title">Recharge</div>
  <div class="page-sub">Choisissez votre moyen de paiement, puis ajoutez des fonds.</div>

  <div class="balance-note">
    <div><div class="lbl">Solde actuel</div><div class="amt" id="balance-amt">—</div></div>
  </div>

  <div class="provider-row" id="provider-row">
    <div class="provider-card active" data-provider="leekpay" onclick="selectProvider('leekpay')">
      <div class="name">LeekPay</div>
      <div class="tag">Tous opérateurs</div>
    </div>
    <div class="provider-card" data-provider="soleaspay" onclick="selectProvider('soleaspay')">
      <div class="name">SoleasPay</div>
      <div class="tag">Selon le pays</div>
    </div>
  </div>

  <div class="form-card">
    <div class="msg" id="recharge-msg"></div>
    <form id="recharge-form" onsubmit="return handleRecharge(event)">
      <div class="field">
        <label>Pays</label>
        <select id="rc-country" onchange="updateOperators()" required>
          <option value="" disabled selected>Sélectionnez votre pays</option>
          <option value="SN">🇸🇳 Sénégal</option>
          <option value="CM">🇨🇲 Cameroun</option>
          <option value="TG">🇹🇬 Togo</option>
          <option value="BJ">🇧🇯 Bénin</option>
          <option value="CI">🇨🇮 Côte d'Ivoire</option>
          <option value="NE">🇳🇪 Niger</option>
          <option value="BF">🇧🇫 Burkina Faso</option>
          <option value="ML">🇲🇱 Mali</option>
        </select>
      </div>

      <div class="field">
        <label>Opérateur</label>
        <select id="rc-operator" required>
          <option value="" disabled selected>Choisissez d'abord un pays</option>
        </select>
      </div>

      <div class="field" id="field-name" style="display:none;">
        <label>Nom complet</label>
        <input type="text" id="rc-name" placeholder="Prénom et nom">
      </div>

      <div class="field">
        <label>Numéro Mobile Money</label>
        <input type="tel" id="rc-phone" placeholder="77 123 45 67" required>
      </div>

      <div class="field">
        <label>Montant (FCFA)</label>
        <div class="quick-amounts" id="quick-amounts">
          <div class="quick-amt" data-amt="3000">3 000</div>
          <div class="quick-amt" data-amt="5000">5 000</div>
          <div class="quick-amt" data-amt="10000">10 000</div>
          <div class="quick-amt" data-amt="25000">25 000</div>
        </div>
        <input type="number" id="rc-amount" min="3000" step="1" placeholder="Minimum 3 000 FCFA" required>
      </div>

      <div class="fee-note" id="fee-note">Paiement sécurisé via LeekPay · Dépôt minimum : 3 000 FCFA</div>
      <button type="submit" class="submit-btn" id="rc-submit">Recharger</button>
    </form>
  </div>
</main>

<nav class="bottom-nav">
  <a href="invest.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
    <span>Investir</span>
  </a>
  <a href="vitesse.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15 16 10"/><circle cx="12" cy="15" r="1"/></svg>
    <span>Vitesse</span>
  </a>
  <a href="profil.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span>Profil</span>
  </a>
  <a href="affilie.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M2 21c0-3.5 2.5-6 5-6s5 2.5 5 6"/><path d="M12 21c0-3.5 2.5-6 5-6s5 2.5 5 6"/></svg>
    <span>Affilié</span>
  </a>
</nav>

<!-- SDK LeekPay -->
<script src="https://leekpay.fr/js/leekpay.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://tjwauutdpdahzxphhrxa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqd2F1dXRkcGRhaHp4cGhocnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODg3MTQsImV4cCI6MjEwMDQ2NDcxNH0.KTZte9pS5JUu1gZJ4i7KXIDc4hHFjJhDlZcoy6begnA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ⚠️ Remplace par ta vraie clé PUBLIQUE LeekPay (pk_live_xxx) — jamais la clé secrète ici.
  const LEEKPAY_PUBLIC_KEY = 'pk_live_aWmHUDEt1X4cjvdPM9vl88VcvRfLkO8K';

  // ⚠️ Remplace par ta vraie clé x-api-key SoleasPay (disponible sur leur dashboard).
  const SOLEASPAY_API_KEY = 'RY4_Pz69OhEuFqSVH_ptZU_HottxXFvhYzyp5l4Ovb8-AP';
  const SOLEASPAY_BASE_URL = 'https://soleaspay.com';
  const SOLEASPAY_SUPPORTED_COUNTRIES = ['CM','CI','BF','BJ','TG'];
  const COUNTRY_CURRENCY = { SN:'XOF', CM:'XAF', TG:'XOF', BJ:'XOF', CI:'XOF', NE:'XOF', BF:'XOF' };

  const OPERATORS_LEEKPAY = {
    SN: ['Orange Money', 'Wave', 'Free Money'],
    CM: ['MTN Mobile Money', 'Orange Money'],
    TG: ['T-Money (Togocel)', 'Moov Flooz'],
    BJ: ['MTN Mobile Money', 'Moov Money'],
    CI: ['Orange Money', 'MTN Money', 'Moov Money', 'Wave'],
    NE: ['Airtel Money', 'Orange Money', 'Moov Money'],
    BF: ['Orange Money', 'Moov Money'],
    ML: ['Orange Money', 'Moov Money'],
  };

  // Correspondance réelle vérifiée sur l'API SoleasPay (leur doc PDF est incomplète) :
  // https://soleaspay.com/api/services-list — un identifiant "service" différent par pays ET par opérateur.
  // Le Sénégal, le Niger et le Mali n'ont aucun service actif chez SoleasPay pour le moment.
  const OPERATORS_SOLEASPAY = {
    CM: { 'MTN Mobile Money': 1, 'Orange Money': 2 },
    CI: { 'Orange Money': 29, 'MTN Money': 30, 'Moov Money': 31, 'Wave': 32 },
    BF: { 'Moov Money': 33, 'Orange Money': 34 },
    BJ: { 'MTN Mobile Money': 35, 'Moov Money': 36 },
    TG: { 'T-Money (Togocel)': 37, 'Moov Flooz': 38 },
  };

  let currentProvider = 'leekpay';
  let profile = null;
  let userId = null;

  function fmt(n){ return Math.round(n).toLocaleString('fr-FR'); }
  function showMsg(text, isError){
    const el = document.getElementById('recharge-msg');
    el.textContent = text;
    el.className = 'msg show ' + (isError ? 'err' : 'ok');
  }

  function selectProvider(provider){
    currentProvider = provider;
    document.querySelectorAll('.provider-card').forEach(c => c.classList.toggle('active', c.dataset.provider === provider));
    document.getElementById('field-name').style.display = provider === 'soleaspay' ? 'block' : 'none';
    document.getElementById('rc-name').required = provider === 'soleaspay';
    updateOperators();
  }

  function updateOperators(){
    const country = document.getElementById('rc-country').value;
    const sel = document.getElementById('rc-operator');
    const feeNote = document.getElementById('fee-note');

    if(currentProvider === 'leekpay'){
      const ops = OPERATORS_LEEKPAY[country] || [];
      sel.innerHTML = '<option value="" disabled selected>Choisissez un opérateur</option>' +
        ops.map(o => `<option value="${o}">${o}</option>`).join('');
      feeNote.textContent = 'Paiement sécurisé via LeekPay · Dépôt minimum : 3 000 FCFA';
      return;
    }

    // SoleasPay
    if(!country){
      sel.innerHTML = '<option value="" disabled selected>Choisissez d\'abord un pays</option>';
      feeNote.textContent = 'Paiement via SoleasPay · Dépôt minimum : 3 000 FCFA';
      return;
    }
    if(!SOLEASPAY_SUPPORTED_COUNTRIES.includes(country)){
      sel.innerHTML = '<option value="" disabled selected>SoleasPay indisponible pour ce pays</option>';
      feeNote.textContent = "SoleasPay n'est pas encore disponible pour ce pays — choisissez LeekPay à la place.";
      return;
    }
    const ops = Object.keys(OPERATORS_SOLEASPAY[country] || {});
    sel.innerHTML = '<option value="" disabled selected>Choisissez un opérateur</option>' +
      ops.map(o => `<option value="${o}">${o}</option>`).join('');
    feeNote.textContent = 'Paiement via SoleasPay · Crédité après confirmation manuelle · Dépôt minimum : 3 000 FCFA';
  }

  document.getElementById('quick-amounts').addEventListener('click', (e) => {
    const btn = e.target.closest('.quick-amt');
    if(!btn) return;
    document.querySelectorAll('.quick-amt').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('rc-amount').value = btn.dataset.amt;
  });

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if(!session || !session.user){ window.location.href = 'login.html'; return; }
    userId = session.user.id;

    const { data: prof, error } = await sb.from('profiles').select('*').eq('id', userId).single();
    if(error || !prof){ window.location.href = 'login.html'; return; }
    profile = prof;

    document.getElementById('balance-amt').textContent = fmt(profile.balance) + ' FCFA';
    if(profile.country){ document.getElementById('rc-country').value = profile.country; }
    if(profile.phone){ document.getElementById('rc-phone').value = profile.phone; }
    updateOperators();

    document.getElementById('loading-screen').style.display = 'none';
  }

  async function handleRecharge(e){
    e.preventDefault();
    if(currentProvider === 'leekpay') return handleLeekPay();
    return handleSoleasPay();
  }

  function handleLeekPay(){
    const btn = document.getElementById('rc-submit');
    const country = document.getElementById('rc-country').value;
    const operator = document.getElementById('rc-operator').value;
    const amount = Number(document.getElementById('rc-amount').value);

    document.getElementById('recharge-msg').className = 'msg';

    if(!country || !operator){ showMsg('Choisissez un pays et un opérateur.', true); return false; }
    if(amount < 3000){ showMsg('Le montant minimum est de 3 000 FCFA.', true); return false; }

    btn.disabled = true; btn.textContent = 'Ouverture du paiement…';

    if(LEEKPAY_PUBLIC_KEY.includes('REMPLACE_MOI')){
      showMsg("Configuration manquante : remplace LEEKPAY_PUBLIC_KEY dans le code de cette page.", true);
      btn.disabled = false; btn.textContent = 'Recharger';
      return false;
    }
    if(typeof LeekPay === 'undefined' || !LeekPay.checkout){
      showMsg("Le module LeekPay ne s'est pas chargé (bloqueur de script ou connexion).", true);
      btn.disabled = false; btn.textContent = 'Recharger';
      return false;
    }

    try {
      LeekPay.checkout({
        amount: amount,
        currency: 'XOF',
        apiKey: LEEKPAY_PUBLIC_KEY,
        description: `Recharge ROMANDEX · ${operator} · ${country}`,
        customerEmail: profile.email,

        onSuccess: async function(data){
          const newBalance = Number(profile.balance) + Number(data.amount);
          const { error: updErr } = await sb.from('profiles').update({ balance: newBalance }).eq('id', userId);
          if(updErr){ showMsg("Paiement reçu mais erreur solde : " + updErr.message, true); return; }

          await sb.from('transactions').insert({
            user_id: userId, type: 'deposit', amount: data.amount, status: 'completed', method: `LeekPay · ${operator}`
          });

          profile.balance = newBalance;
          document.getElementById('balance-amt').textContent = fmt(profile.balance) + ' FCFA';
          showMsg(`Recharge réussie : ${fmt(data.amount)} FCFA ajoutés. Nouveau solde : ${fmt(newBalance)} FCFA.`, false);
          btn.disabled = false; btn.textContent = 'Recharger';
        },
        onCancel: function(){
          showMsg('Paiement annulé.', true);
          btn.disabled = false; btn.textContent = 'Recharger';
        }
      });
    } catch(err){
      showMsg("Erreur au lancement du paiement : " + err.message, true);
      btn.disabled = false; btn.textContent = 'Recharger';
    }

    return false;
  }

  async function handleSoleasPay(){
    const btn = document.getElementById('rc-submit');
    const country = document.getElementById('rc-country').value;
    const operator = document.getElementById('rc-operator').value;
    const clientName = document.getElementById('rc-name').value.trim();
    const phone = document.getElementById('rc-phone').value.trim();
    const amount = Number(document.getElementById('rc-amount').value);

    document.getElementById('recharge-msg').className = 'msg';

    if(!country || !operator){ showMsg('Choisissez un pays et un opérateur.', true); return false; }
    if(!clientName){ showMsg('Renseignez votre nom complet.', true); return false; }
    if(!phone){ showMsg('Renseignez votre numéro Mobile Money.', true); return false; }
    if(amount < 3000){ showMsg('Le montant minimum est de 3 000 FCFA.', true); return false; }
    if(!SOLEASPAY_SUPPORTED_COUNTRIES.includes(country)){
      showMsg("SoleasPay n'est pas disponible pour ce pays. Choisissez LeekPay à la place.", true);
      return false;
    }

    if(SOLEASPAY_API_KEY.includes('A_REMPLACER')){
      showMsg("Configuration manquante : remplace SOLEASPAY_API_KEY dans le code de cette page.", true);
      return false;
    }

    btn.disabled = true; btn.textContent = 'Envoi de la demande…';

    const orderId = 'RMDX-' + Date.now() + '-' + Math.random().toString(36).slice(2,6).toUpperCase();
    const currency = COUNTRY_CURRENCY[country] || 'XOF';
    const serviceId = (OPERATORS_SOLEASPAY[country] || {})[operator];

    if(!serviceId){
      showMsg("Cet opérateur n'est pas reconnu par SoleasPay pour ce pays.", true);
      btn.disabled = false; btn.textContent = 'Recharger';
      return false;
    }

    let result;
    try {
      const response = await fetch(SOLEASPAY_BASE_URL + '/api/agent/bills/v3', {
        method: 'POST',
        headers: {
          'x-api-key': SOLEASPAY_API_KEY,
          'operation': '2',
          'service': String(serviceId),
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          wallet: phone,
          amount: amount,
          currency: currency,
          orderId: orderId,
          description: `Recharge ROMANDEX`,
          payer: clientName,
          payerEmail: profile.email,
          successUrl: location.origin + '/recharge.html',
          failureUrl: location.origin + '/recharge.html'
        })
      });
      result = await response.json();

      if(!result || result.success === false){
        showMsg("Erreur SoleasPay : " + (result && result.message || 'demande refusée'), true);
        btn.disabled = false; btn.textContent = 'Recharger';
        return false;
      }
    } catch(err){
      showMsg("Impossible de contacter SoleasPay : " + err.message, true);
      btn.disabled = false; btn.textContent = 'Recharger';
      return false;
    }

    // Statut "en attente" par sécurité : la confirmation définitive passe par un callback serveur
    // que ce site (statique) ne peut pas recevoir directement. Validation manuelle par l'admin.
    const { error: txErr } = await sb.from('transactions').insert({
      user_id: userId, type: 'deposit', amount: amount, status: 'pending', method: `SoleasPay · ${operator} · ${orderId}`
    });

    btn.disabled = false; btn.textContent = 'Recharger';

    if(txErr){
      showMsg("Demande envoyée à SoleasPay mais erreur d'enregistrement : " + txErr.message, true);
      return false;
    }

    showMsg(`Demande envoyée ! Validez le paiement de ${fmt(amount)} FCFA sur votre téléphone (${phone}). Votre solde sera crédité après confirmation.`, false);
    document.getElementById('recharge-form').reset();
    return false;
  }

  init();
</script>
</body>
</html>
