<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — ROMANDEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0c0f; --steel:#1b1f26; --chrome:#c9d0d6; --chrome-dim:#7d848d;
    --red:#d62839; --gold:#e3b23c; --white:#f4f6f7; --line: rgba(201,208,214,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--black); color:var(--white); font-family:'Manrope', sans-serif;
    min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  header{padding:20px 24px; border-bottom:1px solid var(--line);}
  .logo{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:22px; letter-spacing:0.12em;
    background:linear-gradient(120deg, #dfe4e8, #8b929a 45%, #f4f6f7 55%, #6f757d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo span{color:var(--red); -webkit-text-fill-color:var(--red);}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:32px 20px;}
  .card{
    width:100%; max-width:420px; background:var(--steel); border:1px solid var(--line);
    border-top:2px solid var(--gold); border-radius:8px; padding:30px 24px;
  }
  h1{font-family:'Rajdhani', sans-serif; font-weight:700; text-transform:uppercase; font-size:24px; margin-bottom:6px;}
  .sub{color:var(--chrome-dim); font-size:14px; margin-bottom:22px; line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-family:'Rajdhani',sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chrome-dim); margin-bottom:6px;}
  .field input{
    width:100%; background:var(--black); border:1px solid var(--line); color:var(--white);
    padding:12px 13px; font-family:'Space Mono',monospace; font-size:14px; border-radius:4px; outline:none;
  }
  .field input:focus{border-color:var(--red);}
  .submit{
    width:100%; margin-top:8px; font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:0.06em;
    text-transform:uppercase; font-size:15px; padding:14px; border-radius:4px;
    background:var(--red); color:#fff; border:1px solid var(--red); cursor:pointer;
  }
  .submit:disabled{opacity:0.6; cursor:wait;}
  .msg{
    font-family:'Rajdhani',sans-serif; font-size:13px; padding:11px 13px; border-radius:4px;
    margin-bottom:16px; display:none;
  }
  .msg.show{display:block;}
  .msg.err{background:rgba(214,40,57,0.14); color:#ff8a94; border:1px solid rgba(214,40,57,0.35);}
  .msg.ok{background:rgba(227,178,60,0.12); color:var(--gold); border:1px solid rgba(227,178,60,0.35);}
</style>
</head>
<body>

<header>
  <a href="login.html" class="logo">R<span>O</span>MANDEX</a>
</header>

<main>
  <div class="card">
    <h1>Nouveau mot de passe</h1>
    <p class="sub">Choisissez un nouveau mot de passe pour votre compte.</p>

    <div class="msg" id="msg"></div>

    <form id="reset-form" onsubmit="return handleReset(event)">
      <div class="field">
        <label>Nouveau mot de passe</label>
        <input type="password" id="new-password" minlength="6" placeholder="6 caractères minimum" required>
      </div>
      <div class="field">
        <label>Confirmez le mot de passe</label>
        <input type="password" id="confirm-password" minlength="6" required>
      </div>
      <button type="submit" class="submit" id="submit-btn">Enregistrer le nouveau mot de passe</button>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://tjwauutdpdahzxphhrxa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqd2F1dXRkcGRhaHp4cGhocnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODg3MTQsImV4cCI6MjEwMDQ2NDcxNH0.KTZte9pS5JUu1gZJ4i7KXIDc4hHFjJhDlZcoy6begnA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showMsg(text, isError){
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg show ' + (isError ? 'err' : 'ok');
  }

  // Supabase place automatiquement une session temporaire "recovery" à partir du lien reçu par email.
  sb.auth.onAuthStateChange((event, session) => {
    if(event === 'PASSWORD_RECOVERY'){
      // Session de récupération prête — le formulaire peut être utilisé.
    }
  });

  async function handleReset(e){
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const pass = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;

    if(pass !== confirm){
      showMsg('Les deux mots de passe ne correspondent pas.', true);
      return false;
    }

    btn.disabled = true; btn.textContent = 'Enregistrement…';

    const { error } = await sb.auth.updateUser({ password: pass });

    btn.disabled = false; btn.textContent = 'Enregistrer le nouveau mot de passe';

    if(error){
      showMsg("Erreur : " + error.message + " — le lien a peut-être expiré, redemandez-en un depuis la page de connexion.", true);
      return false;
    }

    showMsg('Mot de passe mis à jour ! Redirection vers la connexion…', false);
    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    return false;
  }
</script>
</body>
</html>
