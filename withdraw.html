<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirer — ROMANDEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0c0f; --steel:#1b1f26; --chrome:#c9d0d6; --chrome-dim:#7d848d;
    --red:#d62839; --gold:#e3b23c; --white:#f4f6f7; --line: rgba(201,208,214,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--black); color:var(--white); font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:78px;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:520px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:40; background:rgba(10,12,15,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  header .wrap{display:flex; align-items:center; gap:12px; height:60px;}
  .back{font-size:20px; color:var(--chrome-dim);}
  .logo{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:20px; letter-spacing:0.12em;
    background:linear-gradient(120deg, #dfe4e8, #8b929a 45%, #f4f6f7 55%, #6f757d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo span{color:var(--red); -webkit-text-fill-color:var(--red);}

  main{padding:20px 0 30px;}
  .page-title{font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; font-size:22px; margin-bottom:4px;}
  .page-sub{color:var(--chrome-dim); font-size:13px; margin-bottom:18px;}

  .balance-note{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:16px;
  }
  .balance-note .lbl{font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chrome-dim);}
  .balance-note .amt{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; margin-top:2px;}

  .form-card{background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chrome-dim); margin-bottom:5px;}
  .field input{
    width:100%; background:var(--black); border:1px solid var(--line); color:var(--white);
    padding:10px 12px; font-family:'Space Mono',monospace; font-size:14px; border-radius:4px; outline:none;
  }
  .field input:focus{border-color:var(--red);}
  .fee-note{font-size:12px; color:var(--chrome-dim); margin:-4px 0 12px; line-height:1.5;}
  .submit-btn{
    width:100%; font-family:'Rajdhani',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.05em;
    font-size:14px; background:var(--red); color:#fff; border:none; padding:12px; border-radius:4px; cursor:pointer;
  }
  .submit-btn:disabled{opacity:0.6; cursor:wait;}

  .msg{font-family:'Rajdhani',sans-serif; font-size:13px; padding:10px 12px; border-radius:4px; margin-bottom:12px; display:none;}
  .msg.show{display:block;}
  .msg.err{background:rgba(214,40,57,0.14); color:#ff8a94; border:1px solid rgba(214,40,57,0.35);}
  .msg.ok{background:rgba(227,178,60,0.12); color:var(--gold); border:1px solid rgba(227,178,60,0.35);}

  .loading-screen{
    position:fixed; inset:0; background:var(--black); display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; color:var(--chrome-dim); letter-spacing:0.1em; text-transform:uppercase; font-size:13px; z-index:100;
  }

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    display:flex; background:rgba(10,12,15,0.95); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:9px 4px 8px; color:var(--chrome-dim);
    font-family:'Rajdhani',sans-serif; font-size:10px; letter-spacing:0.06em; text-transform:uppercase;
  }
  .nav-item svg{width:20px; height:20px;}
  .nav-item.active{color:var(--red);}
</style>
</head>
<body>

<div class="loading-screen" id="loading-screen">Chargement…</div>

<header>
  <div class="wrap">
    <a href="dashboard.html" class="back">←</a>
    <div class="logo">R<span>O</span>MANDEX</div>
  </div>
</header>

<main class="wrap">
  <div class="page-title">Retirer</div>
  <div class="page-sub">Retrait vers Mobile Money.</div>

  <div class="balance-note">
    <div><div class="lbl">Solde disponible</div><div class="amt" id="balance-amt">—</div></div>
  </div>

  <div class="form-card">
    <div class="msg" id="withdraw-msg"></div>
    <form id="withdraw-form" onsubmit="return handleWithdraw(event)">
      <div class="field">
        <label>Montant (FCFA)</label>
        <input type="number" id="wd-amount" min="1500" step="1" placeholder="Minimum 1 500 FCFA" required>
      </div>
      <div class="fee-note">Frais de retrait : 10% · Disponible de 10h00 à 17h00 · 3 retraits maximum par jour</div>
      <button type="submit" class="submit-btn" id="wd-submit">Demander le retrait</button>
    </form>
  </div>
</main>

<nav class="bottom-nav">
  <a href="recharge.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    <span>Recharge</span>
  </a>
  <a href="vitesse.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15 16 10"/><circle cx="12" cy="15" r="1"/></svg>
    <span>Vitesse</span>
  </a>
  <a href="profil.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span>Profil</span>
  </a>
  <a href="affilie.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M2 21c0-3.5 2.5-6 5-6s5 2.5 5 6"/><path d="M12 21c0-3.5 2.5-6 5-6s5 2.5 5 6"/></svg>
    <span>Affilié</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://tjwauutdpdahzxphhrxa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqd2F1dXRkcGRhaHp4cGhocnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODg3MTQsImV4cCI6MjEwMDQ2NDcxNH0.KTZte9pS5JUu1gZJ4i7KXIDc4hHFjJhDlZcoy6begnA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let profile = null;
  let userId = null;

  function fmt(n){ return Math.round(n).toLocaleString('fr-FR'); }

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if(!session || !session.user){ window.location.href = 'login.html'; return; }
    userId = session.user.id;

    const { data: prof, error } = await sb.from('profiles').select('*').eq('id', userId).single();
    if(error || !prof){ window.location.href = 'login.html'; return; }
    profile = prof;

    document.getElementById('balance-amt').textContent = fmt(profile.balance) + ' FCFA';
    document.getElementById('loading-screen').style.display = 'none';
  }

  function withinWithdrawHours(){
    const h = new Date().getHours();
    return h >= 10 && h < 17;
  }

  async function handleWithdraw(e){
    e.preventDefault();
    const btn = document.getElementById('wd-submit');
    const msgEl = document.getElementById('withdraw-msg');
    const amount = Number(document.getElementById('wd-amount').value);

    msgEl.className = 'msg';

    if(amount < 1500){
      msgEl.textContent = 'Le montant minimum est de 1 500 FCFA.'; msgEl.className = 'msg show err'; return false;
    }
    if(amount > profile.balance){
      msgEl.textContent = 'Solde insuffisant.'; msgEl.className = 'msg show err'; return false;
    }
    if(!withinWithdrawHours()){
      msgEl.textContent = 'Les retraits sont ouverts de 10h00 à 17h00.'; msgEl.className = 'msg show err'; return false;
    }

    const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
    const { data: todaysWithdrawals } = await sb.from('transactions')
      .select('id').eq('user_id', userId).eq('type', 'withdrawal')
      .gte('created_at', startOfDay.toISOString());
    if(todaysWithdrawals && todaysWithdrawals.length >= 3){
      msgEl.textContent = 'Limite de 3 retraits par jour atteinte.'; msgEl.className = 'msg show err'; return false;
    }

    btn.disabled = true; btn.textContent = 'Envoi…';

    const fee = Math.round(amount * 0.10);
    const { error: txErr } = await sb.from('transactions').insert({
      user_id: userId, type: 'withdrawal', amount: amount, fee: fee, status: 'pending'
    });

    if(txErr){
      msgEl.textContent = "Erreur : " + txErr.message; msgEl.className = 'msg show err';
      btn.disabled = false; btn.textContent = 'Demander le retrait';
      return false;
    }

    const newBalance = Number(profile.balance) - amount;
    await sb.from('profiles').update({ balance: newBalance }).eq('id', userId);
    profile.balance = newBalance;
    document.getElementById('balance-amt').textContent = fmt(profile.balance) + ' FCFA';

    msgEl.textContent = `Demande de retrait envoyée : ${fmt(amount)} FCFA (frais ${fmt(fee)} FCFA). Traitement sous 24h.`;
    msgEl.className = 'msg show ok';
    document.getElementById('withdraw-form').reset();
    btn.disabled = false; btn.textContent = 'Demander le retrait';
    return false;
  }

  init();
</script>
</body>
</html>
