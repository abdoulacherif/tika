<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirer — ROMANDEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0c0f; --steel:#1b1f26; --chrome:#c9d0d6; --chrome-dim:#7d848d;
    --red:#d62839; --gold:#e3b23c; --white:#f4f6f7; --line: rgba(201,208,214,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--black); color:var(--white); font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:78px;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:520px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:40; background:rgba(10,12,15,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  header .wrap{display:flex; align-items:center; gap:12px; height:60px;}
  .back{font-size:20px; color:var(--chrome-dim);}
  .logo{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:20px; letter-spacing:0.12em;
    background:linear-gradient(120deg, #dfe4e8, #8b929a 45%, #f4f6f7 55%, #6f757d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo span{color:var(--red); -webkit-text-fill-color:var(--red);}

  main{padding:20px 0 30px;}
  .page-title{font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; font-size:22px; margin-bottom:4px;}
  .page-sub{color:var(--chrome-dim); font-size:13px; margin-bottom:18px;}

  .balance-note{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:16px;
  }
  .balance-note .lbl{font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chrome-dim);}
  .balance-note .amt{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; margin-top:2px;}

  .niger-shortcut{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:13px 16px; margin-bottom:12px;
    cursor:pointer; transition:border-color .15s ease;
  }
  .niger-shortcut.active{border-color:var(--gold);}
  .niger-shortcut .ns-left{display:flex; align-items:center; gap:10px;}
  .niger-shortcut .ns-flag{font-size:20px;}
  .niger-shortcut .ns-name{font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; font-size:14px;}
  .niger-shortcut .ns-tag{font-size:11px; color:var(--chrome-dim); margin-top:1px;}
  .niger-shortcut .ns-check{
    width:20px; height:20px; border-radius:50%; border:1px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .niger-shortcut.active .ns-check{border-color:var(--gold); background:var(--gold);}
  .niger-shortcut.active .ns-check::after{content:''; width:8px; height:8px; border-radius:50%; background:var(--black);}
  .other-country-link{
    display:none; font-family:'Rajdhani',sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--chrome-dim); text-align:right; margin:-6px 0 12px; cursor:pointer;
  }
  .other-country-link.show{display:block;}

  .form-card{background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chrome-dim); margin-bottom:5px;}
  .field input{
    width:100%; background:var(--black); border:1px solid var(--line); color:var(--white);
    padding:10px 12px; font-family:'Space Mono',monospace; font-size:14px; border-radius:4px; outline:none;
  }
  .field input:focus{border-color:var(--red);}
  .field select{
    width:100%; background:var(--black); border:1px solid var(--line); color:var(--white);
    padding:10px 12px; font-family:'Space Mono',monospace; font-size:14px; border-radius:4px; outline:none;
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237d848d' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 13px center; background-size:16px;
  }
  .field select:focus{border-color:var(--red);}
  .fee-note{font-size:12px; color:var(--chrome-dim); margin:-4px 0 12px; line-height:1.5;}
  .submit-btn{
    width:100%; font-family:'Rajdhani',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.05em;
    font-size:14px; background:var(--red); color:#fff; border:none; padding:12px; border-radius:4px; cursor:pointer;
  }
  .submit-btn:disabled{opacity:0.6; cursor:wait;}

  .msg{font-family:'Rajdhani',sans-serif; font-size:13px; padding:10px 12px; border-radius:4px; margin-bottom:12px; display:none;}
  .msg.show{display:block;}
  .msg.err{background:rgba(214,40,57,0.14); color:#ff8a94; border:1px solid rgba(214,40,57,0.35);}
  .msg.ok{background:rgba(227,178,60,0.12); color:var(--gold); border:1px solid rgba(227,178,60,0.35);}

  .loading-screen{
    position:fixed; inset:0; background:var(--black); display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; color:var(--chrome-dim); letter-spacing:0.1em; text-transform:uppercase; font-size:13px; z-index:100;
  }

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    display:flex; background:rgba(10,12,15,0.95); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:9px 4px 8px; color:var(--chrome-dim);
    font-family:'Rajdhani',sans-serif; font-size:10px; letter-spacing:0.06em; text-transform:uppercase;
  }
  .nav-item svg{width:20px; height:20px;}
  .nav-item.active{color:var(--red);}
</style>
</head>
<body>

<div class="loading-screen" id="loading-screen">Chargement…</div>

<header>
  <div class="wrap">
    <a href="dashboard.html" class="back">←</a>
    <div class="logo">R<span>O</span>MANDEX</div>
  </div>
</header>

<main class="wrap">
  <div class="page-title">Retirer</div>
  <div class="page-sub">Retrait vers Mobile Money.</div>

  <div class="balance-note">
    <div><div class="lbl">Solde disponible</div><div class="amt" id="balance-amt">—</div></div>
  </div>

  <div class="niger-shortcut" id="niger-shortcut" onclick="toggleNiger()">
    <div class="ns-left">
      <div class="ns-flag">🇳🇪</div>
      <div>
        <div class="ns-name">Retrait Niger</div>
        <div class="ns-tag">Nita / Amana ta</div>
      </div>
    </div>
    <div class="ns-check"></div>
  </div>
  <div class="other-country-link" id="other-country-link" onclick="toggleNiger()">← Choisir un autre pays</div>

  <div class="form-card">
    <div class="msg" id="withdraw-msg"></div>
    <form id="withdraw-form" onsubmit="return handleWithdraw(event)">
      <div class="field" id="field-country">
        <label>Pays</label>
        <select id="wd-country" onchange="updateOperators()" required>
          <option value="" disabled selected>Sélectionnez votre pays</option>
          <option value="SN">🇸🇳 Sénégal</option>
          <option value="CM">🇨🇲 Cameroun</option>
          <option value="TG">🇹🇬 Togo</option>
          <option value="BJ">🇧🇯 Bénin</option>
          <option value="CI">🇨🇮 Côte d'Ivoire</option>
          <option value="BF">🇧🇫 Burkina Faso</option>
          <option value="ML">🇲🇱 Mali</option>
        </select>
      </div>

      <div class="field">
        <label>Opérateur</label>
        <select id="wd-operator" required>
          <option value="" disabled selected>Choisissez d'abord un pays</option>
        </select>
      </div>

      <div class="field">
        <label>Numéro Mobile Money</label>
        <input type="tel" id="wd-phone" placeholder="77 123 45 67" required>
      </div>

      <div class="field">
        <label>Montant (FCFA)</label>
        <input type="number" id="wd-amount" min="1000" step="1" placeholder="Minimum 1 000 FCFA" required>
      </div>
      <div class="fee-note">Frais de retrait : 10% · Disponible de 10h00 à 17h00 · 3 retraits maximum par jour</div>
      <button type="submit" class="submit-btn" id="wd-submit">Demander le retrait</button>
    </form>
  </div>
</main>

<nav class="bottom-nav">
  <a href="invest.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
    <span>Investir</span>
  </a>
  <a href="vitesse.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15 16 10"/><circle cx="12" cy="15" r="1"/></svg>
    <span>Vitesse</span>
  </a>
  <a href="profil.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span>Profil</span>
  </a>
  <a href="affilie.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M2 21c0-3.5 2.5-6 5-6s5 2.5 5 6"/><path d="M12 21c0-3.5 2.5-6 5-6s5 2.5 5 6"/></svg>
    <span>Affilié</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://tjwauutdpdahzxphhrxa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqd2F1dXRkcGRhaHp4cGhocnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODg3MTQsImV4cCI6MjEwMDQ2NDcxNH0.KTZte9pS5JUu1gZJ4i7KXIDc4hHFjJhDlZcoy6begnA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let profile = null;
  let userId = null;
  let nigerMode = false;

  const OPERATORS_NIGER = ['Nita', 'Amana ta'];

  const OPERATORS = {
    SN: ['Orange Money', 'Wave', 'Free Money'],
    CM: ['MTN Mobile Money', 'Orange Money'],
    TG: ['T-Money (Togocel)', 'Moov Flooz'],
    BJ: ['MTN Mobile Money', 'Moov Money'],
    CI: ['Orange Money', 'MTN Money', 'Moov Money', 'Wave'],
    BF: ['Orange Money', 'Moov Money'],
  };

  function fmt(n){ return Math.round(n).toLocaleString('fr-FR'); }

  function updateOperators(){
    const sel = document.getElementById('wd-operator');
    if(nigerMode){
      sel.innerHTML = '<option value="" disabled selected>Choisissez un opérateur</option>' +
        OPERATORS_NIGER.map(o => `<option value="${o}">${o}</option>`).join('');
      return;
    }
    const country = document.getElementById('wd-country').value;
    const ops = OPERATORS[country] || [];
    sel.innerHTML = '<option value="" disabled selected>Choisissez un opérateur</option>' +
      ops.map(o => `<option value="${o}">${o}</option>`).join('');
  }

  function toggleNiger(){
    nigerMode = !nigerMode;
    const shortcut = document.getElementById('niger-shortcut');
    const fieldCountry = document.getElementById('field-country');
    const otherLink = document.getElementById('other-country-link');
    const countrySel = document.getElementById('wd-country');

    shortcut.classList.toggle('active', nigerMode);
    fieldCountry.style.display = nigerMode ? 'none' : 'block';
    otherLink.classList.toggle('show', nigerMode);
    countrySel.required = !nigerMode;

    document.getElementById('wd-operator').value = '';
    updateOperators();
  }

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if(!session || !session.user){ window.location.href = 'login.html'; return; }
    userId = session.user.id;

    const { data: prof, error } = await sb.from('profiles').select('*').eq('id', userId).single();
    if(error || !prof){ window.location.href = 'login.html'; return; }
    profile = prof;

    document.getElementById('balance-amt').textContent = fmt(profile.balance) + ' FCFA';
    if(profile.country){ document.getElementById('wd-country').value = profile.country; updateOperators(); }
    if(profile.phone){ document.getElementById('wd-phone').value = profile.phone; }

    document.getElementById('loading-screen').style.display = 'none';
  }

  function withinWithdrawHours(){
    const h = new Date().getHours();
    return h >= 10 && h < 17;
  }

  async function handleWithdraw(e){
    e.preventDefault();
    const btn = document.getElementById('wd-submit');
    const msgEl = document.getElementById('withdraw-msg');
    const country = nigerMode ? 'NE' : document.getElementById('wd-country').value;
    const operator = document.getElementById('wd-operator').value;
    const phone = document.getElementById('wd-phone').value.trim();
    const amount = Number(document.getElementById('wd-amount').value);

    msgEl.className = 'msg';

    if(!country || !operator){
      msgEl.textContent = 'Choisissez un pays et un opérateur.'; msgEl.className = 'msg show err'; return false;
    }
    if(!phone){
      msgEl.textContent = 'Renseignez votre numéro Mobile Money.'; msgEl.className = 'msg show err'; return false;
    }

    btn.disabled = true; btn.textContent = 'Envoi…';

    const method = `${operator} · ${country} · ${phone}`;
    const { data, error } = await sb.rpc('request_withdrawal', { p_amount: amount, p_method: method });

    btn.disabled = false; btn.textContent = 'Demander le retrait';

    if(error){
      msgEl.textContent = "Erreur : " + error.message; msgEl.className = 'msg show err';
      return false;
    }

    if(!data || !data.success){
      const errors = {
        amount_too_low: 'Le montant minimum est de 1 000 FCFA.',
        insufficient_balance: 'Solde insuffisant.',
        too_frequent: 'Merci de patienter un peu avant une nouvelle demande.',
        daily_limit: 'Limite de 3 retraits par jour atteinte.',
        outside_hours: 'Les retraits sont ouverts de 10h00 à 17h00.',
      };
      msgEl.textContent = errors[data && data.error] || "Impossible d'effectuer ce retrait.";
      msgEl.className = 'msg show err';
      return false;
    }

    const { data: fresh } = await sb.from('profiles').select('balance').eq('id', userId).single();
    if(fresh){ profile.balance = fresh.balance; document.getElementById('balance-amt').textContent = fmt(profile.balance) + ' FCFA'; }

    msgEl.textContent = `Demande de retrait envoyée : ${fmt(amount)} FCFA (frais ${fmt(data.fee)} FCFA) vers ${operator} ${phone}. Traitement sous 24h.`;
    msgEl.className = 'msg show ok';
    document.getElementById('withdraw-form').reset();
    if(nigerMode){ toggleNiger(); }
    if(profile.country){ document.getElementById('wd-country').value = profile.country; updateOperators(); }
    btn.disabled = false; btn.textContent = 'Demander le retrait';
    return false;
  }

  init();
</script>
</body>
</html>
