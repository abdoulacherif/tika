<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitesse — ROMANDEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0c0f; --steel:#1b1f26; --chrome:#c9d0d6; --chrome-dim:#7d848d;
    --red:#d62839; --gold:#e3b23c; --white:#f4f6f7; --line: rgba(201,208,214,0.12);
    --green:#3ecf7e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--black); color:var(--white); font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:78px;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:520px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:40; background:rgba(10,12,15,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  header .wrap{display:flex; align-items:center; gap:12px; height:60px;}
  .back{font-size:20px; color:var(--chrome-dim);}
  .logo{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:20px; letter-spacing:0.12em;
    background:linear-gradient(120deg, #dfe4e8, #8b929a 45%, #f4f6f7 55%, #6f757d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo span{color:var(--red); -webkit-text-fill-color:var(--red);}

  main{padding:20px 0 30px;}
  .page-title{font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; font-size:22px; margin-bottom:4px;}
  .page-sub{color:var(--chrome-dim); font-size:13px; margin-bottom:18px;}

  /* GAUGE */
  .gauge-card{
    background:linear-gradient(160deg, var(--steel), #14171c); border:1px solid var(--line); border-top:2px solid var(--gold);
    border-radius:10px; padding:22px; text-align:center;
  }
  .gauge{width:220px; height:220px; margin:0 auto; position:relative;}
  .gauge svg{width:100%; height:100%;}
  .needle{transform-origin:110px 110px;}
  .gauge-readout{position:absolute; left:50%; top:66%; transform:translate(-50%,-50%); text-align:center;}
  .gauge-readout .num{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:34px; line-height:1;}
  .gauge-readout .num span{color:var(--gold); font-size:18px;}
  .gauge-readout .lbl{font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--chrome-dim); margin-top:4px;}
  .gauge-caption{font-family:'Rajdhani',sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chrome-dim); margin-top:10px;}

  /* daily gain claim */
  .section{margin-top:20px;}
  .section-title{font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; font-size:14px; letter-spacing:0.05em; color:var(--chrome); margin-bottom:10px;}
  .gain-card{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:16px;
  }
  .gain-card .txt b{display:block; font-family:'Rajdhani',sans-serif; text-transform:uppercase; font-size:15px; color:var(--white); margin-bottom:2px;}
  .gain-card .txt span{font-size:12px; color:var(--chrome-dim);}
  .claim-btn{
    font-family:'Rajdhani',sans-serif; font-weight:600; text-transform:uppercase; font-size:13px;
    background:var(--gold); color:#1a1400; border:none; padding:10px 16px; border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  .claim-btn:disabled{background:var(--steel); border:1px solid var(--line); color:var(--chrome-dim); cursor:default;}

  /* progress */
  .progress-card{background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:16px;}
  .progress-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .progress-top .lbl{font-family:'Rajdhani',sans-serif; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--chrome-dim);}
  .progress-top .val{font-family:'Space Mono',monospace; font-size:13px; color:var(--gold);}
  .progress-track{height:8px; background:var(--black); border-radius:4px; overflow:hidden; border:1px solid var(--line);}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--red), var(--gold)); border-radius:4px;}
  .progress-days{display:flex; justify-content:space-between; margin-top:8px; font-family:'Space Mono',monospace; font-size:11px; color:var(--chrome-dim);}

  .stats-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat-box{background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:14px;}
  .stat-box .v{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; color:var(--gold);}
  .stat-box .k{font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--chrome-dim); margin-top:2px;}

  .empty-vip{
    background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:28px 18px; text-align:center;
  }
  .empty-vip p{color:var(--chrome-dim); font-size:13px; margin:10px 0 16px; line-height:1.6;}
  .cta-invest{
    display:inline-block; font-family:'Rajdhani',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.05em;
    font-size:14px; background:var(--red); color:#fff; padding:11px 22px; border-radius:4px;
  }

  .msg{font-family:'Rajdhani',sans-serif; font-size:13px; padding:10px 12px; border-radius:4px; margin:14px 0; display:none;}
  .msg.show{display:block;}
  .msg.err{background:rgba(214,40,57,0.14); color:#ff8a94; border:1px solid rgba(214,40,57,0.35);}
  .msg.ok{background:rgba(227,178,60,0.12); color:var(--gold); border:1px solid rgba(227,178,60,0.35);}

  .loading-screen{
    position:fixed; inset:0; background:var(--black); display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; color:var(--chrome-dim); letter-spacing:0.1em; text-transform:uppercase; font-size:13px; z-index:100;
  }
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    display:flex; background:rgba(10,12,15,0.95); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:9px 4px 8px; color:var(--chrome-dim);
    font-family:'Rajdhani',sans-serif; font-size:10px; letter-spacing:0.06em; text-transform:uppercase;
  }
  .nav-item svg{width:20px; height:20px;}
  .nav-item.active{color:var(--red);}
</style>
</head>
<body>

<div class="loading-screen" id="loading-screen">Chargement…</div>

<header>
  <div class="wrap">
    <a href="dashboard.html" class="back">←</a>
    <div class="logo">R<span>O</span>MANDEX</div>
  </div>
</header>

<main class="wrap">
  <div class="page-title">Vitesse</div>
  <div class="page-sub">Le régime moteur de votre investissement.</div>

  <div id="vitesse-content">
    <div class="empty-vip"><p>Chargement…</p></div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="recharge.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    <span>Recharge</span>
  </a>
  <a href="vitesse.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15 16 10"/><circle cx="12" cy="15" r="1"/></svg>
    <span>Vitesse</span>
  </a>
  <a href="profil.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span>Profil</span>
  </a>
  <a href="affilie.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M2 21c0-3.5 2.5-6 5-6s5 2.5 5 6"/><path d="M12 21c0-3.5 2.5-6 5-6s5 2.5 5 6"/></svg>
    <span>Affilié</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://tjwauutdpdahzxphhrxa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqd2F1dXRkcGRhaHp4cGhocnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODg3MTQsImV4cCI6MjEwMDQ2NDcxNH0.KTZte9pS5JUu1gZJ4i7KXIDc4hHFjJhDlZcoy6begnA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const VIP_TIERS = {
    1:{amount:3000,  daily:330},   2:{amount:5000,  daily:550},
    3:{amount:10000, daily:1100},  4:{amount:15000, daily:1650},
    5:{amount:25000, daily:2750},  6:{amount:35000, daily:3850},
    7:{amount:50000, daily:5500},  8:{amount:60000, daily:6600},
    9:{amount:100000,daily:11000}, 10:{amount:150000,daily:16500},
  };

  let profile = null;
  let userId = null;
  let investments = [];

  function fmt(n){ return Math.round(n).toLocaleString('fr-FR'); }

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if(!session || !session.user){ window.location.href = 'login.html'; return; }
    userId = session.user.id;

    const { data: prof, error } = await sb.from('profiles').select('*').eq('id', userId).single();
    if(error || !prof){ window.location.href = 'login.html'; return; }
    profile = prof;

    await render();
    document.getElementById('loading-screen').style.display = 'none';
  }

  async function render(){
    const el = document.getElementById('vitesse-content');

    const { data: inv, error } = await sb.from('investments')
      .select('*').eq('user_id', userId).order('started_at', { ascending:false });

    if(error){
      el.innerHTML = `<div class="empty-vip"><p>Erreur de chargement : ${error.message}</p></div>`;
      return;
    }

    investments = inv || [];
    const activeOnes = investments.filter(i => i.status === 'active');

    if(activeOnes.length === 0){
      el.innerHTML = `
        <div class="empty-vip">
          <p>Aucun investissement actif. Choisissez un palier VIP pour voir votre vitesse de croisière ici.</p>
          <a href="invest.html" class="cta-invest">Investir maintenant</a>
        </div>
      `;
      return;
    }

    const { data: gains } = await sb.from('transactions')
      .select('amount').eq('user_id', userId).eq('type', 'daily_gain').eq('status', 'completed');
    const totalGained = (gains || []).reduce((s,t) => s + Number(t.amount), 0);
    const totalProjected = activeOnes.reduce((s,i) => s + Number(i.daily_gain) * i.duration_days, 0);

    el.innerHTML = `
      <div class="section">
        <div class="stats-row">
          <div class="stat-box"><div class="v">${fmt(totalGained)}F</div><div class="k">Total gagné (tous investissements)</div></div>
          <div class="stat-box"><div class="v">${fmt(totalProjected)}F</div><div class="k">Projeté sur 130j (cumulé)</div></div>
        </div>
      </div>
    ` + activeOnes.map(i => renderInvestmentCard(i)).join('');
  }

  function renderInvestmentCard(inv){
    const rate = ((Number(inv.daily_gain) / Number(inv.amount)) * 100).toFixed(1);
    const needleAngle = -125 + Math.min(rate / 15, 1) * 163;

    const startedAt = new Date(inv.started_at);
    const daysElapsed = Math.floor((Date.now() - startedAt.getTime()) / 86400000);
    const daysLeft = Math.max(0, inv.duration_days - daysElapsed);
    const progressPct = Math.min(100, (daysElapsed / inv.duration_days) * 100);

    const tooEarly = daysElapsed < 1;
    const lastClaim = inv.last_claim_at ? new Date(inv.last_claim_at) : null;
    const claimedToday = lastClaim && lastClaim.toDateString() === new Date().toDateString();
    const canClaim = !tooEarly && !claimedToday;

    let btnLabel = 'Réclamer';
    if(tooEarly) btnLabel = 'Disponible demain';
    else if(claimedToday) btnLabel = 'Déjà réclamé';

    return `
      <div class="section">
        <div class="gauge-card">
          <div class="gauge">
            <svg viewBox="0 0 220 220">
              <defs>
                <linearGradient id="arcGrad-${inv.id}" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#7d848d"/>
                  <stop offset="60%" stop-color="#c9d0d6"/>
                  <stop offset="85%" stop-color="#e3b23c"/>
                  <stop offset="100%" stop-color="#d62839"/>
                </linearGradient>
              </defs>
              <circle cx="110" cy="110" r="92" fill="none" stroke="#1b1f26" stroke-width="12"/>
              <path d="M 33 172 A 92 92 0 1 1 187 172" fill="none" stroke="url(#arcGrad-${inv.id})" stroke-width="12" stroke-linecap="round"/>
              <g class="needle" style="transform:rotate(${needleAngle}deg)">
                <line x1="110" y1="110" x2="110" y2="34" stroke="#e3b23c" stroke-width="3"/>
                <circle cx="110" cy="110" r="7" fill="#e3b23c"/>
              </g>
            </svg>
            <div class="gauge-readout">
              <div class="num">${rate}<span>%</span></div>
              <div class="lbl">Gain / jour</div>
            </div>
          </div>
          <div class="gauge-caption">VIP ${inv.vip_level} · ${fmt(inv.amount)} FCFA investis · démarré le ${startedAt.toLocaleDateString('fr-FR')}</div>
        </div>

        <div class="gain-card" style="margin-top:14px;">
          <div class="txt"><b>${fmt(inv.daily_gain)} FCFA</b><span>${tooEarly ? "Premier gain disponible demain" : "Disponible une fois par jour"}</span></div>
          <button class="claim-btn" id="claim-${inv.id}" ${canClaim ? '' : 'disabled'} onclick="claimGain('${inv.id}')">
            ${btnLabel}
          </button>
        </div>

        <div class="progress-card" style="margin-top:14px;">
          <div class="progress-top"><span class="lbl">Jour ${Math.max(0,daysElapsed)} / ${inv.duration_days}</span><span class="val">${progressPct.toFixed(0)}%</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
          <div class="progress-days"><span>${Math.max(0,daysElapsed)} jours écoulés</span><span>${daysLeft} jours restants</span></div>
        </div>
      </div>
    `;
  }

  async function claimGain(investmentId){
    const btn = document.getElementById('claim-' + investmentId);
    btn.disabled = true; btn.textContent = 'En cours…';

    const { data, error } = await sb.rpc('claim_investment_gain', { p_investment_id: investmentId });

    if(error){
      showToast("Erreur : " + error.message, true);
      btn.disabled = false; btn.textContent = 'Réclamer';
      return;
    }

    if(!data || !data.success){
      const errors = {
        too_early: "Le premier gain n'est disponible que le lendemain de l'investissement.",
        already_claimed_today: 'Déjà réclamé aujourd\'hui.',
        expired: 'Cet investissement est arrivé à échéance (130 jours écoulés).',
        not_active: 'Cet investissement n\'est plus actif.',
      };
      showToast(errors[data && data.error] || "Impossible de réclamer ce gain.", true);
      await render();
      return;
    }

    profile.balance = Number(profile.balance) + Number(data.amount);
    showToast(`${fmt(data.amount)} FCFA ajoutés à votre solde.`, false);
    await render();
  }

  function showToast(text, isError){
    let el = document.getElementById('vitesse-toast');
    if(!el){
      el = document.createElement('div');
      el.id = 'vitesse-toast';
      el.className = 'msg';
      document.getElementById('vitesse-content').prepend(el);
    }
    el.textContent = text;
    el.className = 'msg show ' + (isError ? 'err' : 'ok');
  }

  init();
</script>
</body>
</html>
