<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — ROMANDEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0c0f; --steel:#1b1f26; --steel-2:#262b34; --chrome:#c9d0d6; --chrome-dim:#7d848d;
    --red:#d62839; --gold:#e3b23c; --white:#f4f6f7; --line: rgba(201,208,214,0.12);
    --green:#3ecf7e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--black); color:var(--white); font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:70px;
    position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(circle at 15% -8%, rgba(214,40,57,0.14), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(227,178,60,0.08), transparent 40%),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 8px);
  }
  header, main{position:relative; z-index:1;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:520px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:40; background:rgba(10,12,15,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  header .wrap{display:flex; align-items:center; justify-content:space-between; height:60px;}
  .logo{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:20px; letter-spacing:0.12em;
    background:linear-gradient(120deg, #dfe4e8, #8b929a 45%, #f4f6f7 55%, #6f757d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo span{color:var(--red); -webkit-text-fill-color:var(--red);}
  .logout{font-family:'Rajdhani',sans-serif; font-size:13px; letter-spacing:0.06em; text-transform:uppercase; color:var(--chrome-dim); border:1px solid var(--line); padding:7px 12px; border-radius:2px; cursor:pointer; background:none;}

  main{padding:20px 0 30px;}

  .balance-card{
    background:linear-gradient(160deg, var(--steel), #14171c);
    border:1px solid var(--line); border-top:2px solid var(--gold);
    border-radius:10px; padding:22px 20px; position:relative; overflow:hidden;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.6);
  }
  .balance-card::after{
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,0.06), transparent);
    transform:skewX(-20deg);
    animation:sheen 5s ease-in-out infinite;
    animation-delay:1.2s;
  }
  @keyframes sheen{
    0%{left:-60%;}
    35%{left:130%;}
    100%{left:130%;}
  }
  .balance-card .lbl{font-family:'Rajdhani',sans-serif; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--chrome-dim);}
  .balance-card .amt{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:38px; margin-top:6px; transition:color .3s ease;}
  .balance-card .amt.flash{color:var(--green);}
  .balance-card .amt span{font-size:20px; color:var(--chrome-dim); font-weight:600;}
  .balance-row{display:flex; justify-content:space-between; align-items:flex-end; margin-top:4px;}
  .vip-pill{
    font-family:'Rajdhani',sans-serif; font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    background:rgba(227,178,60,0.12); color:var(--gold); border:1px solid rgba(227,178,60,0.35);
    padding:5px 11px; border-radius:20px;
    animation:pulseGlow 2.6s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 0 0 rgba(227,178,60,0);}
    50%{box-shadow:0 0 14px rgba(227,178,60,0.35);}
  }
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;}
  .action-btn{
    font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
    font-size:14px; padding:12px; border-radius:4px; text-align:center; cursor:pointer; border:none;
    transition:transform .12s ease, filter .12s ease;
  }
  .action-btn:active{transform:scale(0.96);}
  .action-btn.primary{background:var(--red); color:#fff; box-shadow:0 8px 20px -8px rgba(214,40,57,0.6);}
  .action-btn.ghost{background:none; border:1px solid var(--line); color:var(--chrome);}

  @keyframes revealUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .reveal{opacity:0; animation:revealUp .55s cubic-bezier(.22,1,.36,1) forwards;}
  .reveal.r1{animation-delay:.05s;}
  .reveal.r2{animation-delay:.14s;}
  .reveal.r3{animation-delay:.22s;}
  .reveal.r4{animation-delay:.30s;}

  .claim-btn, .copy-btn, .submit-btn{transition:transform .12s ease;}
  .claim-btn:active, .copy-btn:active, .submit-btn:active{transform:scale(0.95);}

  .section{margin-top:26px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .section-title{font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; font-size:15px; letter-spacing:0.05em; color:var(--chrome);}

  /* daily reward */
  .reward-card{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:16px 16px;
  }
  .reward-card .txt{font-size:13px; color:var(--chrome-dim); line-height:1.4;}
  .reward-card .txt b{color:var(--white); font-family:'Rajdhani',sans-serif; font-size:15px; text-transform:uppercase; display:block; margin-bottom:2px;}
  .claim-btn{
    font-family:'Rajdhani',sans-serif; font-weight:600; text-transform:uppercase; font-size:13px;
    background:var(--gold); color:#1a1400; border:none; padding:10px 16px; border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  .claim-btn:disabled{background:var(--steel-2); color:var(--chrome-dim); cursor:default;}

  /* referral */
  .ref-card{background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:16px;}
  .ref-code{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--black); border:1px solid var(--line); border-radius:4px; padding:11px 13px;
  }
  .ref-code .code{font-family:'Space Mono',monospace; font-size:15px; color:var(--gold); letter-spacing:0.05em;}
  .copy-btn{font-family:'Rajdhani',sans-serif; font-size:12px; text-transform:uppercase; color:var(--chrome); background:none; border:1px solid var(--line); padding:6px 10px; border-radius:3px; cursor:pointer;}
  .ref-tiers{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
  .ref-tier{background:var(--black); border:1px solid var(--line); border-radius:6px; padding:10px 8px; text-align:center;}
  .ref-tier .p{font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--red); font-size:16px;}
  .ref-tier .l{font-size:10px; color:var(--chrome-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}

  /* VIP tiers - invest */
  .vip-list{display:flex; flex-direction:column; gap:8px;}
  .vip-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--steel); border:1px solid var(--line); border-radius:6px; padding:12px 14px;
  }
  .vip-row.current{border-color:var(--gold);}
  .vip-row .name{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px;}
  .vip-row .meta{font-family:'Space Mono',monospace; font-size:12px; color:var(--chrome-dim); margin-top:2px;}
  .vip-row .invest-btn{
    font-family:'Rajdhani',sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:0.05em;
    background:none; border:1px solid var(--red); color:var(--red); padding:7px 12px; border-radius:4px; cursor:pointer;
  }

  /* withdraw form */
  .form-card{background:var(--steel); border:1px solid var(--line); border-radius:8px; padding:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chrome-dim); margin-bottom:5px;}
  .field input{
    width:100%; background:var(--black); border:1px solid var(--line); color:var(--white);
    padding:10px 12px; font-family:'Space Mono',monospace; font-size:14px; border-radius:4px; outline:none;
  }
  .field input:focus{border-color:var(--red);}
  .fee-note{font-size:12px; color:var(--chrome-dim); margin:-4px 0 12px;}
  .submit-btn{
    width:100%; font-family:'Rajdhani',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.05em;
    font-size:14px; background:var(--red); color:#fff; border:none; padding:12px; border-radius:4px; cursor:pointer;
  }
  .submit-btn:disabled{opacity:0.6; cursor:wait;}

  /* history */
  .history-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .history-item:last-child{border-bottom:none;}
  .history-item .t{font-family:'Rajdhani',sans-serif; font-size:13px; text-transform:uppercase; color:var(--chrome);}
  .history-item .d{font-size:11px; color:var(--chrome-dim); margin-top:2px;}
  .history-item .a{font-family:'Space Mono',monospace; font-size:14px;}
  .a.pos{color:var(--green);}
  .a.neg{color:var(--red);}
  .status-tag{font-size:10px; text-transform:uppercase; letter-spacing:0.05em; padding:2px 7px; border-radius:10px; margin-left:6px;}
  .status-tag.pending{background:rgba(227,178,60,0.14); color:var(--gold);}
  .status-tag.completed{background:rgba(62,207,126,0.14); color:var(--green);}
  .status-tag.failed{background:rgba(214,40,57,0.14); color:var(--red);}

  .msg{font-family:'Rajdhani',sans-serif; font-size:13px; padding:10px 12px; border-radius:4px; margin-bottom:12px; display:none;}
  .msg.show{display:block;}
  .msg.err{background:rgba(214,40,57,0.14); color:#ff8a94; border:1px solid rgba(214,40,57,0.35);}
  .msg.ok{background:rgba(227,178,60,0.12); color:var(--gold); border:1px solid rgba(227,178,60,0.35);}

  .empty{color:var(--chrome-dim); font-size:13px; text-align:center; padding:20px 0;}
  .loading-screen{
    position:fixed; inset:0; background:var(--black); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    font-family:'Rajdhani',sans-serif; color:var(--chrome-dim); letter-spacing:0.1em; text-transform:uppercase; font-size:12px; z-index:100;
  }
  .loading-logo{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:26px; letter-spacing:0.14em;
    color:var(--chrome); animation:loadingPulse 1.4s ease-in-out infinite;
  }
  .loading-logo span{color:var(--red);}
  @keyframes loadingPulse{
    0%,100%{opacity:.45; filter:blur(0.3px);}
    50%{opacity:1;}
  }
  .loading-bar{width:120px; height:2px; background:var(--line); border-radius:2px; overflow:hidden;}
  .loading-bar::after{
    content:""; display:block; width:40%; height:100%; background:linear-gradient(90deg, var(--red), var(--gold));
    animation:loadingBar 1.1s ease-in-out infinite;
  }
  @keyframes loadingBar{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(350%);}
  }

  .skeleton{
    background:linear-gradient(100deg, var(--steel) 30%, var(--steel-2) 50%, var(--steel) 70%);
    background-size:200% 100%; animation:skeletonMove 1.3s ease-in-out infinite; border-radius:6px;
  }
  @keyframes skeletonMove{
    0%{background-position:120% 0;}
    100%{background-position:-20% 0;}
  }

  /* BOTTOM NAV */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    display:flex; background:rgba(10,12,15,0.95); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:9px 4px 8px; color:var(--chrome-dim);
    font-family:'Rajdhani',sans-serif; font-size:10px; letter-spacing:0.06em; text-transform:uppercase;
  }
  .nav-item svg{width:20px; height:20px;}
  .nav-item.active{color:var(--red);}
</style>
</head>
<body>

<div class="loading-screen" id="loading-screen">
  <div class="loading-logo">R<span>O</span>MANDEX</div>
  <div class="loading-bar"></div>
</div>

<header>
  <div class="wrap">
    <div class="logo">R<span>O</span>MANDEX</div>
    <button class="logout" onclick="handleLogout()">Déconnexion</button>
  </div>
</header>

<main class="wrap">

  <div class="balance-card reveal r1">
    <div class="balance-row">
      <div>
        <div class="lbl">Solde disponible</div>
        <div class="amt" id="balance-amt">— <span>FCFA</span></div>
      </div>
      <div class="vip-pill" id="vip-pill">VIP 0</div>
    </div>
    <div class="actions">
      <a href="recharge.html" class="action-btn primary" style="display:flex; align-items:center; justify-content:center;">Recharger</a>
      <a href="withdraw.html" class="action-btn ghost" style="display:flex; align-items:center; justify-content:center;">Retirer</a>
    </div>
  </div>

  <div class="section reveal r2">
    <div class="reward-card">
      <div class="txt"><b>Récompense journalière</b>50 FCFA à réclamer chaque jour</div>
      <button class="claim-btn" id="claim-btn" onclick="claimDailyReward()">Réclamer</button>
    </div>
  </div>

  <div class="section reveal r3">
    <div class="section-head"><div class="section-title">Parrainage</div></div>
    <div class="ref-card">
      <div class="ref-code">
        <span class="code" id="ref-code">AX——————</span>
        <button class="copy-btn" onclick="copyRefCode()">Copier</button>
      </div>
      <div class="ref-tiers">
        <div class="ref-tier"><div class="p">25%</div><div class="l">Niveau 1</div></div>
        <div class="ref-tier"><div class="p">2%</div><div class="l">Niveau 2</div></div>
        <div class="ref-tier"><div class="p">1%</div><div class="l">Niveau 3</div></div>
      </div>
    </div>
  </div>

  <div class="section reveal r4">
    <div class="section-head"><div class="section-title">Historique</div></div>
    <div class="form-card" id="history-list">
      <div class="skeleton" style="height:44px; margin-bottom:8px;"></div>
      <div class="skeleton" style="height:44px; margin-bottom:8px;"></div>
      <div class="skeleton" style="height:44px;"></div>
    </div>
  </div>

</main>

<nav class="bottom-nav">
  <a href="invest.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
    <span>Investir</span>
  </a>
  <a href="vitesse.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15 16 10"/><circle cx="12" cy="15" r="1"/></svg>
    <span>Vitesse</span>
  </a>
  <a href="profil.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span>Profil</span>
  </a>
  <a href="affilie.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M2 21c0-3.5 2.5-6 5-6s5 2.5 5 6"/><path d="M12 21c0-3.5 2.5-6 5-6s5 2.5 5 6"/></svg>
    <span>Affilié</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://tjwauutdpdahzxphhrxa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqd2F1dXRkcGRhaHp4cGhocnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODg3MTQsImV4cCI6MjEwMDQ2NDcxNH0.KTZte9pS5JUu1gZJ4i7KXIDc4hHFjJhDlZcoy6begnA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let profile = null;
  let userId = null;

  function fmt(n){ return Math.round(n).toLocaleString('fr-FR'); }

  function animateBalance(from, to, flash){
    const el = document.getElementById('balance-amt');
    const duration = 700;
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const value = from + (to - from) * eased;
      el.innerHTML = fmt(value) + ' <span>FCFA</span>';
      if(t < 1) requestAnimationFrame(step);
      else if(flash){
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 700);
      }
    }
    requestAnimationFrame(step);
  }

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if(!session || !session.user){ window.location.href = 'login.html'; return; }
    userId = session.user.id;

    const { data: prof, error } = await sb.from('profiles').select('*').eq('id', userId).single();
    if(error || !prof){ window.location.href = 'login.html'; return; }
    profile = prof;

    renderProfile(true);
    await refreshClaimButton();
    await loadHistory();

    document.getElementById('loading-screen').style.display = 'none';
  }

  function renderProfile(initial){
    if(initial) animateBalance(0, Number(profile.balance), false);
    else document.getElementById('balance-amt').innerHTML = fmt(profile.balance) + ' <span>FCFA</span>';
    document.getElementById('vip-pill').textContent = 'VIP ' + profile.vip_level;
    document.getElementById('ref-code').textContent = profile.referral_code;
  }

  function copyRefCode(){
    navigator.clipboard.writeText(profile.referral_code);
  }

  async function refreshClaimButton(){
    const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
    const { data } = await sb.from('transactions')
      .select('id').eq('user_id', userId).eq('type', 'daily_reward')
      .gte('created_at', startOfDay.toISOString());
    const btn = document.getElementById('claim-btn');
    if(data && data.length > 0){
      btn.disabled = true; btn.textContent = 'Déjà réclamée';
    }
  }

  async function claimDailyReward(){
    const btn = document.getElementById('claim-btn');
    btn.disabled = true; btn.textContent = 'En cours…';

    const { error: txErr } = await sb.from('transactions').insert({
      user_id: userId, type: 'daily_reward', amount: 50, status: 'completed'
    });
    if(txErr){ btn.disabled = false; btn.textContent = 'Réclamer'; alert("Erreur : " + txErr.message); return; }

    const newBalance = Number(profile.balance) + 50;
    const { error: updErr } = await sb.from('profiles').update({ balance: newBalance }).eq('id', userId);
    if(updErr){ alert("Erreur solde : " + updErr.message); return; }

    const oldBalance = Number(profile.balance);
    profile.balance = newBalance;
    animateBalance(oldBalance, newBalance, true);
    btn.textContent = 'Déjà réclamée';
    await loadHistory();
  }

  const TYPE_LABELS = {
    deposit: 'Investissement', withdrawal: 'Retrait', daily_gain: 'Gain quotidien',
    daily_reward: 'Récompense journalière', referral_commission: 'Commission parrainage', signup_bonus: "Bonus d'inscription"
  };
  const STATUS_LABELS = { pending:'En attente', completed:'Terminé', failed:'Échoué' };

  async function loadHistory(){
    const el = document.getElementById('history-list');
    const { data, error } = await sb.from('transactions')
      .select('*').eq('user_id', userId).order('created_at', { ascending:false }).limit(20);

    if(error || !data || data.length === 0){
      el.innerHTML = '<div class="empty">Aucune transaction pour le moment.</div>';
      return;
    }

    const isNegative = t => t.type === 'withdrawal';
    el.innerHTML = data.map(t => `
      <div class="history-item">
        <div>
          <div class="t">${TYPE_LABELS[t.type] || t.type}</div>
          <div class="d">${new Date(t.created_at).toLocaleString('fr-FR')}</div>
        </div>
        <div style="text-align:right;">
          <span class="a ${isNegative(t) ? 'neg' : 'pos'}">${isNegative(t) ? '-' : '+'}${fmt(t.amount)}F</span>
          <span class="status-tag ${t.status}">${STATUS_LABELS[t.status]}</span>
        </div>
      </div>
    `).join('');
  }

  async function handleLogout(){
    await sb.auth.signOut();
    window.location.href = 'login.html';
  }

  init();
</script>
</body>
</html>
